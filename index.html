/* ============================================================
   ESTADÍSTICAS POR INSTALADOR
   ============================================================ */
// Agrupa una lista de eventos de etapa por instalador. Solo cuenta las veces que se MARCA
// una etapa (activar=true); desmarcar no resta, para no confundir el recuento de trabajo hecho.
function agregarPorInstalador(eventos){
  const map = new Map();
  eventos.forEach(ev=>{
    if(ev.tipo !== "etapa" || !ev.activar) return;
    const key = ev.nombre || "—";
    if(!map.has(key)) map.set(key, {instalada:0,sellada:0,acristalada:0,composite:0,terminada:0,total:0,ultima:null});
    const r = map.get(key);
    if(ETAPAS.includes(ev.etapa)) r[ev.etapa] = (r[ev.etapa]||0) + 1;
    r.total++;
    if(!r.ultima || (ev.fecha && ev.fecha > r.ultima)) r.ultima = ev.fecha;
  });
  return [...map.entries()].map(([nombre,r])=>({nombre,...r})).sort((a,b)=> b.total - a.total);
}

// Fila de Excel/PDF para el export de estadísticas por instalador — comparte forma entre la vista
// global y la de una obra concreta.
function filaExcelEstadistica(f){
  return {
    Instalador: f.nombre,
    Instalada: f.instalada||0, Sellada: f.sellada||0, Acristalada: f.acristalada||0,
    Composite: f.composite||0, Terminada: f.terminada||0, Total: f.total||0,
    "Última actividad": fechaCorta(f.ultima)
  };
}

function generarExcelEstadisticas(nombreArchivo, filas){
  if(!filas.length){ toast("No hay actividad que exportar"); return; }
  const ws = XLSX.utils.json_to_sheet(filas.map(filaExcelEstadistica));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Instaladores");
  XLSX.writeFile(wb, `${nombreArchivo}.xlsx`);
  toast("Excel generado");
}

function generarPdfEstadisticas(titulo, filas){
  if(!filas.length){ toast("No hay actividad que exportar"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const margen = 15;
  let y = margen;
  doc.setFontSize(16); doc.setTextColor(20);
  doc.text(`Estadísticas por instalador — ${titulo}`, margen, y); y += 6;
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text(`Generado: ${new Date().toLocaleString("es-ES")}`, margen, y); y += 10;
  doc.setDrawColor(200); doc.line(margen, y, 210-margen, y); y += 8;

  for(const f of filas){
    if(y > 260){ doc.addPage(); y = margen; }
    doc.setFontSize(12); doc.setTextColor(20);
    doc.text(f.nombre, margen, y); y += 5.5;
    doc.setFontSize(9.5); doc.setTextColor(90);
    doc.text(`Instalada ${f.instalada||0} · Sellada ${f.sellada||0} · Acristalada ${f.acristalada||0} · Composite ${f.composite||0} · Terminada ${f.terminada||0}  (total ${f.total||0})`, margen, y); y += 5;
    doc.text(`Última actividad: ${fechaCorta(f.ultima) || "—"}`, margen, y); y += 8;
    doc.setDrawColor(230); doc.line(margen, y-3, 210-margen, y-3);
  }
  doc.save(`estadisticas_${slug(titulo)}.pdf`);
  toast("PDF generado");
}

function renderEstadisticas(){
  $app().innerHTML = `<div class="empty">Cargando estadísticas…</div>`;
  db.collection("eventos").orderBy("fecha","desc").limit(3000).get().then(snap=>{
    const eventos = snap.docs.map(d=>d.data());
    const filas = agregarPorInstalador(eventos);
    let filtro = "";

    function pintar(){
      const norm = normalizarCabecera(filtro);
      const visibles = norm ? filas.filter(f=> normalizarCabecera(f.nombre).includes(norm)) : filas;
      $app().innerHTML = `
        <div class="card">
          <div class="section-title">Resumen por instalador</div>
          ${filas.length ? `<label class="field"><span>Buscar instalador</span><input type="text" id="inpBuscarInstalador" value="${esc(filtro)}" placeholder="Nombre del instalador…" /></label>` : ""}
          <p class="muted" style="margin-bottom:10px;">🪟 Instalada · 🧴 Sellada · 🔷 Acristalada · 🧱 Composite · ✅ Terminada</p>
          ${!visibles.length ? `<div class="empty">${filas.length ? "Ningún instalador coincide con la búsqueda." : "Todavía no hay actividad registrada."}</div>` : visibles.map(f=>`
            <div class="userrow">
              <div class="info"><h3>${esc(f.nombre)}</h3><p class="muted">Última actividad: ${fechaCorta(f.ultima)}</p></div>
              <div class="stat-mini">
                <span>🪟 ${f.instalada}</span><span>🧴 ${f.sellada}</span><span>🔷 ${f.acristalada}</span><span>🧱 ${f.composite}</span><span>✅ ${f.terminada}</span>
              </div>
            </div>
          `).join("")}
          ${filas.length ? `
            <div class="btn-row" style="margin-top:14px;">
              <button class="btn btn-secondary" id="btnExpEstPdf">🧾 Exportar PDF</button>
              <button class="btn btn-secondary" id="btnExpEstXls">📊 Exportar Excel</button>
            </div>
          ` : ""}
        </div>
      `;
      const inp = document.getElementById("inpBuscarInstalador");
      if(inp){
        inp.addEventListener("input", ()=>{
          filtro = inp.value; pintar();
          const inpN = document.getElementById("inpBuscarInstalador");
          if(inpN){ inpN.focus(); const p = inpN.value.length; inpN.setSelectionRange(p,p); }
        });
      }
      const bPdf = document.getElementById("btnExpEstPdf");
      if(bPdf) bPdf.addEventListener("click", ()=> generarPdfEstadisticas("Todas las obras", visibles));
      const bXls = document.getElementById("btnExpEstXls");
      if(bXls) bXls.addEventListener("click", ()=> generarExcelEstadisticas("estadisticas_instaladores", visibles));
    }
    pintar();
  }).catch(err=> $app().innerHTML = `<div class="empty">Error cargando estadísticas: ${esc(err.message)}</div>`);
}

/* ============================================================
   NOTIFICACIONES (ventanas terminadas)
   No hay backend de verdad, así que esto es un aviso "mientras la app
   está abierta" (en la propia app y, si el navegador lo permite, como
   notificación del sistema) — no es un push real que llegue con la
   app cerrada. Ver README.md.
   ============================================================ */
function iniciarListenerNotificaciones(){
  if(notifUnsub){ notifUnsub(); notifUnsub = null; }
  if(!esAdmin()) return;
  notifBaseline = new Date().toISOString();
  notifVistos = new Set();
  notifUnsub = db.collection("eventos").orderBy("fecha","desc").limit(20).onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type !== "added") return;
      const id = ch.doc.id;
      if(notifVistos.has(id)) return;
      notifVistos.add(id);
      const e = ch.doc.data();
      if(!e.fecha || e.fecha <= notifBaseline) return; // ignora lo que ya existía antes de abrir la app
      if(e.tipo === "etapa" && e.activar && e.etapa === "terminada"){
        toast(`✅ ${e.nombre||"Alguien"} terminó ${e.ventanaEtiqueta||""}${e.obraNombre?` (${e.obraNombre})`:""}`);
        if("Notification" in window && Notification.permission === "granted"){
          try{ new Notification("Ventana terminada", { body: `${e.ventanaEtiqueta||""} — ${e.obraNombre||""}` }); }catch(err){}
        }
        notifNuevas = true;
        pintarBellDot();
      }
    });
  }, ()=>{ /* fallo silencioso: no bloquear la app por esto */ });
}

async function abrirNotificaciones(){

  openModal(`

    });

    const eventos = snap.docs.map(d=>d.data()).filter(e=> e.tipo==="etapa" && e.activar && e.etapa==="terminada");

  }

/* ============================================================
   ESCÁNER DE QR
   ============================================================ */
let html5QrInstance = null;

function renderScanner(){
  $app().innerHTML = `
    <div class="card">
      <div id="reader"></div>
      <p class="muted center" style="margin-top:12px;">Apunta la cámara al código QR pegado en la ventana.</p>
      <button class="link-btn" id="btnManual" style="display:block;margin:8px auto 0;">¿No puedes escanear? Elige la obra manualmente</button>
    </div>
  `;
  document.getElementById("btnManual").addEventListener("click", ()=> navegar("#/"));

  html5QrInstance = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 240, height: 240 } };

  html5QrInstance.start(
    { facingMode: "environment" },
    config,
    (decodedText)=>{
      const ruta = extraerRutaVentana(decodedText);
      if(!ruta){ toast("QR no reconocido"); return; }
      pararScanner();
      navegar(`#/ventana/${ruta.obraId}/${ruta.ventanaId}`);
    },
    ()=>{ /* fallo de lectura de frame individual: ignorar */ }
  ).catch((err)=>{
    document.getElementById("reader").innerHTML =
      `<div class="empty" style="color:#fff;">No se pudo acceder a la cámara.<br/>Comprueba los permisos del navegador.<br/><small>${esc(String(err))}</small></div>`;
  });
}

function pararScanner(){
  if(html5QrInstance){
    html5QrInstance.stop().catch(()=>{}).finally(()=>{
      try{ html5QrInstance.clear(); }catch(e){}
      html5QrInstance = null;
    });
  }
}

function extraerRutaVentana(texto){
  // Acepta la URL completa generada por la app, o solo el fragmento #/ventana/OBRA/VENTANA
  const m = String(texto).match(/#\/ventana\/([^\/\s]+)\/([^\/\s?#]+)/);
  if(!m) return null;
  return { obraId: m[1], ventanaId: m[2] };
}

// Detener la cámara al salir de la pantalla de escaneo o cambiar de ruta
window.addEventListener("hashchange", ()=>{ pararScanner(); });

/* ============================================================
   GENERACIÓN DE QR (offscreen) Y PDFs
   ============================================================ */
function urlVentana(obraId, ventanaId){
  return `${location.origin}${location.pathname}#/ventana/${obraId}/${ventanaId}`;
}

function generarQrDataUrl(texto, size){
  qrHidden.innerHTML = "";
  new QRCode(qrHidden, { text: texto, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  const canvas = qrHidden.querySelector("canvas");
  return canvas ? canvas.toDataURL("image/png") : null;
}

async function generarPdfQr(obraId, obraData, ventanas){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  if(!ventanas.length){ toast("Esta obra no tiene ventanas"); return; }
  toast("Generando PDF de etiquetas…");
  const lista = ordenarVentanas(ventanas); // agrupa visualmente por casa/planta al imprimir
  const avanzado = lista.some(tieneDatosAvanzados);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const margen = 12, cols = 3, rows = avanzado ? 3 : 4, celda = avanzado ? 76 : 62, qrSize = 46;
  const anchoUtil = 210 - margen*2;
  const gapX = (anchoUtil - cols*qrSize) / (cols-1 || 1);
  let col = 0, row = 0;

  for(let i=0;i<lista.length;i++){
    const v = lista[i];
    if(row === rows){ doc.addPage(); row = 0; col = 0; }
    const x = margen + col*(qrSize+gapX);
    const y = margen + row*celda;
    const dataUrl = generarQrDataUrl(urlVentana(obraId, v.id), 300);
    if(dataUrl){ doc.addImage(dataUrl, "PNG", x, y, qrSize, qrSize); }
    doc.setDrawColor(210); doc.rect(x-1, y-1, qrSize+2, qrSize+2);
    doc.setFontSize(11); doc.setTextColor(20);
    doc.text(String(etiquetaCorta(v)), x + qrSize/2, y + qrSize + 6, { align: "center" });
    if(avanzado){
      const linea2 = [v.casa && `Casa ${v.casa}`, v.planta && `Planta ${v.planta}`].filter(Boolean).join(" · ")
        || String(obraData.nombre||"").slice(0,26);
      doc.setFontSize(8); doc.setTextColor(90);
      doc.text(linea2.slice(0,32), x + qrSize/2, y + qrSize + 10.5, { align: "center" });
      if(v.referencia){
        doc.setFontSize(7.5); doc.setTextColor(140);
        doc.text(String(v.referencia).slice(0,34), x + qrSize/2, y + qrSize + 14.5, { align: "center" });
      }
    } else {
      doc.setFontSize(8); doc.setTextColor(120);
      doc.text(String(obraData.nombre||"").slice(0,26), x + qrSize/2, y + qrSize + 10.5, { align: "center" });
    }

    col++;
    if(col === cols){ col = 0; row++; }
    if(i % 15 === 0) await new Promise(r=> setTimeout(r, 0)); // ceder el hilo de UI
  }
  doc.save(`QR_${slug(obraData.nombre)}.pdf`);
  toast("PDF de etiquetas generado");
}

async function generarPdfPendientes(obraId, obraData, ventanas, ambito){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  if(!ventanas.length){ toast("No hay ventanas en ese ámbito"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const margen = 15;
  let y = margen;

  doc.setFontSize(16); doc.setTextColor(20);
  doc.text(`Pendientes — ${obraData.nombre||""}${ambito ? " — Planta " + ambito : ""}`, margen, y); y += 6;
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text(`${obraData.direccion||""}`, margen, y); y += 5;
  doc.text(`Generado: ${new Date().toLocaleString("es-ES")}`, margen, y); y += 10;

  const pendientes = ordenarVentanas(ventanas.filter(v => pasosCompletados(v.estado) < ETAPAS.length));
  const total = ventanas.length, terminadas = total - pendientes.length;

  doc.setFontSize(11); doc.setTextColor(20);
  doc.text(`${terminadas} de ${total} ventanas terminadas · ${pendientes.length} pendientes`, margen, y);
  y += 8;
  doc.setDrawColor(200); doc.line(margen, y, 210-margen, y); y += 8;

  if(!pendientes.length){
    doc.setFontSize(12); doc.text("¡No quedan ventanas pendientes! 🎉", margen, y);
  } else {
    const agrupado = pendientes.some(v=>v.casa);
    let casaActual = null;
    for(const v of pendientes){
      const casaKey = agrupado ? (v.casa || "Sin casa asignada") : null;
      if(agrupado && casaKey !== casaActual){
        if(y > 265){ doc.addPage(); y = margen; }
        casaActual = casaKey;
        if(y > margen) y += 3;
        doc.setFontSize(12); doc.setTextColor(20);
        doc.text(casaKey === "Sin casa asignada" ? casaKey : `Casa ${casaKey}`, margen, y);
        y += 6;
        doc.setDrawColor(225); doc.line(margen, y-3.5, 210-margen, y-3.5);
      }
      if(y > 280){ doc.addPage(); y = margen; casaActual = null; }
      const faltan = ETAPAS.filter(e => !(v.estado && v.estado[e]));
      const detalle = [v.planta && `Planta ${v.planta}`, v.referencia].filter(Boolean).join(" · ");
      const linea = `${etiquetaCorta(v)}${detalle ? " ("+detalle+")" : ""}  —  Falta: ${faltan.map(e=>ETAPA_LABEL[e]).join(", ")}`;
      doc.setFontSize(10.5); doc.setTextColor(20);
      doc.text(linea, margen + (agrupado?4:0), y);
      y += 6.5;
    }
  }
  const sufijo = ambito ? `_Planta_${slug(ambito)}` : "";
  doc.save(`Pendientes_${slug(obraData.nombre)}${sufijo}_${new Date().toISOString().slice(0,10)}.pdf`);
  toast("PDF de pendientes generado");
}

// Descarga una imagen (p.ej. una foto de Cloudinary) y la convierte a data URL para poder
// incrustarla en el PDF con jsPDF. Si la descarga falla (sin red, CORS, foto borrada…) se omite
// la imagen sin romper el resto del informe.
async function urlADataUrl(url){
  try{
    const resp = await fetch(url);
    if(!resp.ok) return null;
    const blob = await resp.blob();
    return await new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> resolve(null);
      reader.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}
function formatoImagenDataUrl(dataUrl){
  const m = /^data:image\/(\w+);/.exec(dataUrl || "");
  if(!m) return "JPEG";
  const t = m[1].toUpperCase();
  return t === "JPG" ? "JPEG" : t;
}

async function generarPdfIncidencias(obraId, obraData, ventanas){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  const conIncidencias = ordenarVentanas(ventanas.filter(v => (v.incidencias||[]).length));
  if(!conIncidencias.length){ toast("No hay incidencias registradas en esta obra"); return; }
  toast("Generando PDF de incidencias…");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const margen = 15, anchoUtil = 210 - margen*2;
  let y = margen;

  doc.setFontSize(16); doc.setTextColor(20);
  doc.text(`Incidencias — ${obraData.nombre||""}`, margen, y); y += 6;
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text(`${obraData.direccion||""}`, margen, y); y += 5;
  doc.text(`Generado: ${new Date().toLocaleString("es-ES")}`, margen, y); y += 10;

  const totalIncidencias = conIncidencias.reduce((n,v)=> n + (v.incidencias||[]).length, 0);
  const pendientesCount = conIncidencias.reduce((n,v)=> n + (v.incidencias||[]).filter(i=>!i.resuelta).length, 0);
  doc.setFontSize(11); doc.setTextColor(20);
  doc.text(`${totalIncidencias} incidencias en ${conIncidencias.length} ventanas · ${pendientesCount} pendientes`, margen, y);
  y += 8;
  doc.setDrawColor(200); doc.line(margen, y, 210-margen, y); y += 8;

  const agrupado = conIncidencias.some(v=>v.casa);
  let casaActual = null;

  for(const v of conIncidencias){
    const casaKey = agrupado ? (v.casa || "Sin casa asignada") : null;
    if(agrupado && casaKey !== casaActual){
      if(y > 260){ doc.addPage(); y = margen; }
      casaActual = casaKey;
      if(y > margen) y += 3;
      doc.setFontSize(13); doc.setTextColor(20);
      doc.text(casaKey === "Sin casa asignada" ? casaKey : `Casa ${casaKey}`, margen, y);
      y += 7;
      doc.setDrawColor(225); doc.line(margen, y-4, 210-margen, y-4);
    }
    if(y > 270){ doc.addPage(); y = margen; casaActual = null; }
    const detalle = [v.planta && `Planta ${v.planta}`, v.referencia].filter(Boolean).join(" · ");
    doc.setFontSize(11.5); doc.setTextColor(20);
    doc.text(`${etiquetaCorta(v)}${detalle ? " ("+detalle+")" : ""}`, margen + (agrupado?4:0), y);
    y += 6;

    const incidencias = (v.incidencias||[]).slice().reverse(); // más reciente primero
    for(const inc of incidencias){
      if(y > 265){ doc.addPage(); y = margen; }
      const sangria = margen + (agrupado?8:4);
      doc.setFontSize(9.5); doc.setTextColor(90);
      doc.text(`${fechaCorta(inc.fecha)} · ${inc.autor||"—"} · ${inc.resuelta?"Resuelta":"Pendiente"}`, sangria, y);
      y += 5;
      doc.setFontSize(10.5); doc.setTextColor(30);
      const lineasTexto = doc.splitTextToSize(inc.texto||"", anchoUtil - (sangria-margen));
      doc.text(lineasTexto, sangria, y);
      y += lineasTexto.length * 5 + 2;

      if(inc.fotoUrl){
        const dataUrl = await urlADataUrl(inc.fotoUrl);
        if(dataUrl){
          if(y > 230){ doc.addPage(); y = margen; }
          try{
            const formato = formatoImagenDataUrl(dataUrl);
            const props = doc.getImageProperties(dataUrl);
            const maxW = 55, maxH = 45;
            let w = maxW, h = (props.height/props.width)*w;
            if(h > maxH){ h = maxH; w = (props.width/props.height)*h; }
            doc.addImage(dataUrl, formato, sangria, y, w, h);
            y += h + 4;
          }catch(e){ /* foto no decodificable: se omite sin romper el informe */ }
        }
      }
      y += 3;
    }
    y += 2;
  }

  doc.save(`Incidencias_${slug(obraData.nombre)}_${new Date().toISOString().slice(0,10)}.pdf`);
  toast("PDF de incidencias generado");
}

function generarExcelIncidencias(obraData, ventanas){

          let w = maxW, h = (props.height/props.width)*w;
          if(h > maxH){ h = maxH; w = (props.width/props.height)*h; }
          doc.setDrawColor(220); doc.rect(margen + 4, y, w, h);
          doc.addImage(dataUrl, formato, margen + 4, y, w, h);
          y += h + 4;
        }catch(e){ /* firma no decodificable: se omite sin romper el informe */ }
      }
    }
    y += 4;
    doc.setDrawColor(230); doc.line(margen, y-2, 210-margen, y-2);
  }

  doc.save(`Entregadas_${slug(obraData.nombre)}_${new Date().toISOString().slice(0,10)}.pdf`);
  toast("PDF de entregas generado");
}

/* ============================================================
   INFORME DE INSTALACIÓN POR PERIODO (día / semana / mes / rango)
   ============================================================ */
// Calcula el rango [ini, fin) según el periodo elegido. "fin" es exclusivo para poder comparar
// directamente con las fechas ISO guardadas en los eventos (ev.fecha < fin.toISOString()).
function calcularRangoInforme(periodo, desde, hasta){
  const ahora = new Date();
  const inicioDia = (d)=> new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(periodo === "hoy"){
    const ini = inicioDia(ahora);
    const fin = new Date(ini); fin.setDate(fin.getDate()+1);
    return { ini, fin, label: `Hoy (${ini.toLocaleDateString("es-ES")})` };
  }
  if(periodo === "semana"){
    const diaSemana = (ahora.getDay()+6)%7; // lunes=0 ... domingo=6
    const ini = inicioDia(ahora); ini.setDate(ini.getDate()-diaSemana);
    const fin = new Date(ini); fin.setDate(fin.getDate()+7);
    const finLabel = new Date(fin.getTime()-1);
    return { ini, fin, label: `Semana del ${ini.toLocaleDateString("es-ES")} al ${finLabel.toLocaleDateString("es-ES")}` };
  }
  if(periodo === "mes"){
    const ini = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
    const fin = new Date(ahora.getFullYear(), ahora.getMonth()+1, 1);
    return { ini, fin, label: ini.toLocaleDateString("es-ES", {month:"long", year:"numeric"}) };
  }
  // Rango personalizado: si falta una fecha, se deja abierta por ese lado.
  const ini = desde ? inicioDia(new Date(desde+"T00:00:00")) : new Date(0);
  const finBase = hasta ? inicioDia(new Date(hasta+"T00:00:00")) : inicioDia(ahora);
  const fin = new Date(finBase); fin.setDate(fin.getDate()+1);
  const finLabel = new Date(fin.getTime()-1);
  return { ini, fin, label: `Del ${ini.toLocaleDateString("es-ES")} al ${finLabel.toLocaleDateString("es-ES")}` };
}

// Clave de agrupación por día en hora local ("YYYY-MM-DD"), para no depender de la hora UTC
// en la que se guardó el evento.
function claveDia(iso){
  return new Date(iso).toLocaleDateString("sv-SE");
}

// De todo el historial de una ventana+etapa, nos quedamos solo con el ÚLTIMO cambio
// (cronológicamente). Si ese último cambio es "marcada" y cae dentro del periodo elegido, es
// una fila del informe. Así no aparece cada marca/desmarca intermedia (p.ej. una corrección del
// instalador), solo cuando la etapa quedó guardada definitivamente como marcada.
function colapsarEventosDefinitivos(eventosEtapa, iniIso, finIso){
  const ordenados = [...eventosEtapa].sort((a,b)=> a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const ultimoPorClave = new Map();
  ordenados.forEach(ev=> ultimoPorClave.set(`${ev.obraId||""}|${ev.ventanaId}|${ev.etapa}`, ev));
  const definitivos = [];
  ultimoPorClave.forEach(ev=>{
    if(ev.activar && ev.fecha >= iniIso && ev.fecha < finIso) definitivos.push(ev);
  });
  return definitivos;
}

function abrirInformeInstalacion(ctx){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  openModal(`
    <h3>Informe de instalación</h3>
    <p class="muted" style="margin-bottom:14px;">
      Cada etapa que ha completado cada instalador en cada ventana en el periodo elegido${ctx.tipo==="obra" ? "" : ", en todas las obras"},
      con el día y la hora exactos en que quedó marcada. Las correcciones (marcar y desmarcar por error) no aparecen, solo el resultado final.
    </p>
    <label class="field"><span>Periodo</span>
      <select id="selPeriodoInforme">
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes" selected>Este mes</option>
        <option value="rango">Rango de fechas…</option>
      </select>
    </label>
    <div id="rangoFechasInforme" style="display:none;">
      <div class="btn-row">
        <label class="field"><span>Desde</span><input type="date" id="inpDesdeInforme" /></label>
        <label class="field"><span>Hasta</span><input type="date" id="inpHastaInforme" /></label>
      </div>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-secondary" id="btnInformePdf">🧾 Exportar PDF</button>
      <button class="btn btn-secondary" id="btnInformeXls">📊 Exportar Excel</button>
    </div>
  `);
  const selPeriodo = document.getElementById("selPeriodoInforme");
  selPeriodo.addEventListener("change", ()=>{
    document.getElementById("rangoFechasInforme").style.display = selPeriodo.value === "rango" ? "block" : "none";
  });

  async function generar(formato){
    const periodo = selPeriodo.value;
    const desde = document.getElementById("inpDesdeInforme").value;
    const hasta = document.getElementById("inpHastaInforme").value;
    if(periodo === "rango" && !desde && !hasta){ toast("Indica al menos una fecha"); return; }
    closeModal();
    toast("Generando informe…");
    try{
      const eventos = ctx.tipo === "obra"
        ? (await db.collection("eventos").where("obraId","==",ctx.obraId).get()).docs.map(d=>d.data())
        : (await db.collection("eventos").orderBy("fecha","desc").limit(3000).get()).docs.map(d=>d.data());
      const { ini, fin, label } = calcularRangoInforme(periodo, desde, hasta);
      const iniIso = ini.toISOString(), finIso = fin.toISOString();
      const soloEtapas = eventos.filter(ev => ev.tipo === "etapa" && ETAPAS.includes(ev.etapa));
      const filtrados = colapsarEventosDefinitivos(soloEtapas, iniIso, finIso);
      const ventanasPorId = ctx.tipo === "obra" ? new Map(ctx.ventanas.map(v=>[v.id, v])) : null;
      const tituloAmbito = ctx.tipo === "obra" ? (ctx.obraNombre || "Obra") : "Todas las obras";
      if(formato === "pdf") generarPdfInformeInstalacion(tituloAmbito, label, filtrados, ventanasPorId);
      else generarExcelInformeInstalacion(tituloAmbito, label, filtrados, ventanasPorId);
    }catch(err){ toast("Error: " + err.message); }
  }
  document.getElementById("btnInformePdf").addEventListener("click", ()=> generar("pdf"));
  document.getElementById("btnInformeXls").addEventListener("click", ()=> generar("xls"));
}

function generarPdfInformeInstalacion(tituloAmbito, periodoLabel, eventos, ventanasPorId){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  if(!eventos.length){ toast("No hay actividad registrada en ese periodo"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const margen = 15;
  const anchoUtil = 210 - margen*2;
  let y = margen;

  doc.setFontSize(16); doc.setTextColor(20);
  doc.text(`Informe de instalación — ${tituloAmbito}`, margen, y); y += 6;
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text(periodoLabel, margen, y); y += 5;
  doc.text(`Generado: ${new Date().toLocaleString("es-ES")}`, margen, y); y += 10;
  doc.setFontSize(11); doc.setTextColor(20);
  doc.text(`${eventos.length} etapa${eventos.length===1?"":"s"} completada${eventos.length===1?"":"s"} en el periodo`, margen, y);
  y += 8;
  doc.setDrawColor(200); doc.line(margen, y, 210-margen, y); y += 8;

  const ordenados = [...eventos].sort((a,b)=> a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const porDia = new Map();
  ordenados.forEach(ev=>{
    const clave = claveDia(ev.fecha);
    if(!porDia.has(clave)) porDia.set(clave, []);
    porDia.get(clave).push(ev);
  });

  for(const [, lista] of porDia){
    if(y > 265){ doc.addPage(); y = margen; }
    doc.setFontSize(12.5); doc.setTextColor(20);
    const fechaLegible = new Date(lista[0].fecha).toLocaleDateString("es-ES", { weekday:"long", day:"2-digit", month:"2-digit", year:"numeric" });
    doc.text(`${fechaLegible}  —  ${lista.length} etapa${lista.length===1?"":"s"}`, margen, y); y += 6;
    doc.setDrawColor(225); doc.line(margen, y-3.5, 210-margen, y-3.5);
    for(const ev of lista){
      const v = ventanasPorId ? ventanasPorId.get(ev.ventanaId) : null;
      const detalle = [v && v.casa && `Casa ${v.casa}`, v && v.planta && `Planta ${v.planta}`].filter(Boolean).join(" · ");
      const obraTxt = ventanasPorId ? "" : `${ev.obraNombre||""} — `;
      const hora = new Date(ev.fecha).toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
      const etapaTxt = `${ETAPA_ICONO[ev.etapa]||""} ${ETAPA_LABEL[ev.etapa]||ev.etapa}`;
      const linea = `${hora}  —  ${obraTxt}${ev.ventanaEtiqueta||""}${detalle ? " ("+detalle+")" : ""}  —  ${etapaTxt}  —  ${ev.nombre||"—"}`;
      doc.setFontSize(10); doc.setTextColor(40);
      const lineasAjustadas = doc.splitTextToSize(linea, anchoUtil - 4);
      if(y + lineasAjustadas.length*5.5 > 285){ doc.addPage(); y = margen; }
      doc.text(lineasAjustadas, margen+4, y);
      y += lineasAjustadas.length * 5.5;
    }
    y += 3;
  }
  doc.save(`Informe_instalacion_${slug(tituloAmbito)}_${new Date().toISOString().slice(0,10)}.pdf`);
  toast("PDF de instalación generado");
}

function generarExcelInformeInstalacion(tituloAmbito, periodoLabel, eventos, ventanasPorId){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  if(!eventos.length){ toast("No hay actividad registrada en ese periodo"); return; }
  const ordenados = [...eventos].sort((a,b)=> a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const filas = ordenados.map(ev=>{
    const v = ventanasPorId ? ventanasPorId.get(ev.ventanaId) : null;
    const f = new Date(ev.fecha);
    return {
      Fecha: f.toLocaleDateString("es-ES"),
      Hora: f.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" }),
      ...(ventanasPorId ? {} : { Obra: ev.obraNombre || "" }),
      Casa: (v && v.casa) || "", Planta: (v && v.planta) || "",
      Ventana: ev.ventanaEtiqueta || "",
      Etapa: ETAPA_LABEL[ev.etapa] || ev.etapa || "",
      Instalador: ev.nombre || ""
    };
  });
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Instalación");
  XLSX.writeFile(wb, `Informe_instalacion_${slug(tituloAmbito)}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast("Excel de instalación generado");
}

function generarExcelCompleto(obraData, ventanas){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  if(!ventanas.length){ toast("Esta obra no tiene ventanas"); return; }
  const rows = ordenarVentanas(ventanas).map(v=>({
    ...filaExcelVentana(v),
    Notas: (v.notas||[]).map(n=>n.texto).join(" | "),
    "Nº fotos": (v.fotos||[]).length
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ventanas");
  XLSX.writeFile(wb, `${slug(obraData.nombre)}_completo_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast("Excel generado");
}

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
function init(){
  qrHidden = document.createElement("div");
  qrHidden.style.cssText = "position:fixed;left:-9999px;top:-9999px;visibility:hidden;";
  document.body.appendChild(qrHidden);

  // Aviso de conexión: funciona tanto si falta configurar Firebase como una vez configurado.
  window.addEventListener("online", actualizarBannerConexion);
  window.addEventListener("offline", actualizarBannerConexion);
  actualizarBannerConexion();

  if(!CONFIG_OK){
    window.addEventListener("hashchange", route);
    route();
    return;
  }

  app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  // Modo con menos datos: guarda los cambios en el propio dispositivo (IndexedDB) cuando no hay
  // cobertura y los sincroniza solo en cuanto vuelve la señal, en vez de perderlos sin más aviso.
  // Si el navegador no lo soporta (modo incógnito, varias pestañas sin sincronizar, etc.) la app
  // sigue funcionando igual, solo que sin ese margen sin conexión.
  db.enablePersistence({ synchronizeTabs: true }).catch((err)=>{
    console.warn("No se pudo activar el modo sin conexión:", err && (err.code || err.message));
  });
  auth = firebase.auth();

  window.addEventListener("hashchange", route);

  auth.onAuthStateChanged((user)=>{
    if(usuarioUnsub){ usuarioUnsub(); usuarioUnsub = null; }
    if(notifUnsub){ notifUnsub(); notifUnsub = null; }
    notifNuevas = false;

    if(!user){
      currentUser = null;
      currentUserData = undefined;
      route();
      return;
    }

    currentUser = user;
    currentUserData = undefined;
    usuarioUnsub = db.collection("usuarios").doc(user.uid).onSnapshot((doc)=>{
      currentUserData = doc.exists ? doc.data() : null;
      iniciarListenerNotificaciones();
      route();
    }, (err)=>{
      currentUserData = null;
      toast("Error cargando tu cuenta: " + err.message);
      route();
    });
  });
}

document.addEventListener("DOMContentLoaded", init);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
