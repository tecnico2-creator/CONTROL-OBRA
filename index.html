<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Control de Instalación</title>
<meta name="theme-color" content="#166534" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Control Obras" />
<style>
  :root{
    --primario:#15803d;
    --primario-osc:#14532d;
    --primario-claro:#dcfce7;
    --gris-100:#f4f5f7;
    --gris-200:#e5e7eb;
    --gris-400:#9ca3af;
    --gris-600:#4b5563;
    --gris-800:#1f2937;
    --rojo:#dc2626;
    --amarillo:#d97706;
    --naranja:#ea580c;
    --indigo:#4f46e5;
    --teal:#0d9488;
    --verde:#16a34a;
    --radio:12px;
    --sombra:0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --sombra-lg:0 10px 30px rgba(20,83,45,.14), 0 2px 8px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--gris-100);
    color:var(--gris-800);
    -webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  #topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,var(--primario),var(--primario-osc));
    color:#fff;
    padding-top:calc(14px + env(safe-area-inset-top));
    padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;
    box-shadow:var(--sombra);
  }
  #topbar .back{
    background:rgba(255,255,255,.16);border:none;color:#fff;
    width:36px;height:36px;border-radius:10px;font-size:18px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  #topbar .titulo{flex:1;min-width:0;}
  #topbar .titulo h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar .titulo .sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar .icon-btn{
    background:rgba(255,255,255,.16);border:none;color:#fff;position:relative;
    width:36px;height:36px;border-radius:10px;font-size:16px;flex-shrink:0;
  }
  #bellDot{
    display:none;position:absolute;top:5px;right:6px;width:8px;height:8px;
    border-radius:50%;background:#f87171;box-shadow:0 0 0 2px var(--primario-osc);
  }
  #app{max-width:760px;margin:0 auto;padding:16px;padding-bottom:60px;}
  .card{
    background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);
    padding:16px;margin-bottom:14px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;
    cursor:pointer;min-height:46px;
  }
  .btn-block{display:flex;width:100%;}
  .btn-primary{background:var(--primario);color:#fff;}
  .btn-primary:active{background:var(--primario-osc);}
  .btn-secondary{background:var(--gris-200);color:var(--gris-800);}
  .btn-danger{background:#fee2e2;color:var(--rojo);}
  .btn-outline{background:#fff;color:var(--primario);border:1.5px solid var(--primario);}
  .btn-sm{padding:8px 12px;font-size:13px;min-height:36px;}
  .btn[disabled]{opacity:.55;pointer-events:none;}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .btn-row .btn{flex:1 1 150px;}
  input[type=text],input[type=number],input[type=password],input[type=email],input[type=file],textarea,select{
    width:100%;border:1.5px solid var(--gris-200);border-radius:10px;
    padding:11px 12px;font-size:15px;background:#fff;color:var(--gris-800);
    font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primario);}
  textarea{resize:vertical;min-height:70px;}
  label.field{display:block;margin-bottom:14px;}
  label.field span{display:block;font-size:13px;font-weight:600;color:var(--gris-600);margin-bottom:6px;}
  .empty{
    text-align:center;color:var(--gris-400);padding:36px 16px;font-size:14px;
  }
  .obra-item{
    display:flex;align-items:center;gap:12px;padding:14px;background:#fff;
    border-radius:var(--radio);box-shadow:var(--sombra);margin-bottom:10px;cursor:pointer;
  }
  .obra-item .avatar{
    width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--primario),var(--primario-osc));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;
  }
  .obra-item .info{flex:1;min-width:0;}
  .obra-item .info h3{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .obra-item .info p{font-size:12.5px;color:var(--gris-600);margin-top:2px;}
  .obra-item .pct{font-size:13px;font-weight:700;color:var(--primario);flex-shrink:0;}
  .progress-wrap{background:var(--gris-200);border-radius:20px;height:10px;overflow:hidden;margin-top:8px;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--primario),var(--verde));border-radius:20px;transition:width .3s;}
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px;}
  .stat{background:var(--gris-100);border-radius:10px;padding:10px 6px;text-align:center;}
  .stat .n{font-size:18px;font-weight:800;}
  .stat .l{font-size:10.5px;color:var(--gris-600);margin-top:2px;line-height:1.2;}
  .stat.instalada .n{color:var(--amarillo);}
  .stat.sellada .n{color:var(--naranja);}
  .stat.acristalada .n{color:var(--indigo);}
  .stat.composite .n{color:var(--teal);}
  .stat.terminada .n{color:var(--verde);}
  .pctbig{font-size:40px;font-weight:800;color:var(--primario);line-height:1;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;background:#fff;border-radius:10px;padding:4px;box-shadow:var(--sombra);overflow-x:auto;}
  .tabs button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--gris-600);white-space:nowrap;}
  .tabs button.active{background:var(--primario);color:#fff;}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;}
  .vchip{
    background:#fff;border-radius:10px;box-shadow:var(--sombra);padding:10px 6px;
    text-align:center;cursor:pointer;border-top:5px solid var(--gris-400);position:relative;
  }
  .vchip.st-instalada{border-top-color:var(--amarillo);}
  .vchip.st-sellada{border-top-color:var(--naranja);}
  .vchip.st-acristalada{border-top-color:var(--indigo);}
  .vchip.st-composite{border-top-color:var(--teal);}
  .vchip.st-terminada{border-top-color:var(--verde);background:#f0fdf4;}
  .vchip.sin-asignar{border-top-style:dashed;border-top-color:var(--gris-400);background:#fafafa;}
  .vchip.sin-asignar .et{color:var(--rojo);font-weight:700;}
  .vchip .num{font-weight:800;font-size:15px;}
  .vchip .et{font-size:9.5px;color:var(--gris-600);margin-top:2px;}
  .vchip .badges{position:absolute;top:4px;right:4px;display:flex;gap:2px;}
  .vchip .badges span{font-size:9px;}
  .vchip .vchip-check{position:absolute;top:5px;left:5px;width:16px;height:16px;}
  .vchip.vchip-sel{outline:2.5px solid var(--primario);background:#eef2ff;}
  .mapa-wrap{position:relative;overflow:hidden;background:var(--gris-100);touch-action:manipulation;line-height:0;}
  .mapa-wrap.editando{cursor:crosshair;}
  .mapa-wrap img{width:100%;display:block;user-select:none;-webkit-user-select:none;}
  .mapa-marker{
    position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;gap:2px;cursor:pointer;
  }
  .mapa-marker::before{
    content:"";display:block;width:16px;height:16px;border-radius:50%;background:var(--gris-400);
    border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .mapa-marker.mm-instalada::before{background:var(--amarillo);}
  .mapa-marker.mm-sellada::before{background:var(--naranja);}
  .mapa-marker.mm-acristalada::before{background:var(--indigo);}
  .mapa-marker.mm-composite::before{background:var(--teal);}
  .mapa-marker.mm-terminada::before{background:var(--verde);}
  .mapa-marker.mm-vacia::before{background:#fff;border-style:dashed;border-color:var(--gris-400);}
  .mapa-marker .mm-label{
    font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:1px 5px;
    border-radius:6px;white-space:nowrap;
  }
  .mapa-marker .mm-alerta{position:absolute;top:-12px;font-size:11px;}
  .etapa-row{
    display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;
    background:var(--gris-100);margin-bottom:10px;
  }
  .etapa-row .chk{
    width:28px;height:28px;border-radius:8px;border:2px solid var(--gris-400);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;font-size:16px;
  }
  .etapa-row.checked .chk{background:var(--verde);border-color:var(--verde);color:#fff;}
  .etapa-row .txt{flex:1;}
  .etapa-row .txt b{font-size:15px;}
  .etapa-row .txt small{display:block;color:var(--gris-600);font-size:12px;}
  .feed-item{border-bottom:1px solid var(--gris-200);padding:12px 0;}
  .feed-item:last-child{border-bottom:none;}
  .feed-item .meta{font-size:12px;color:var(--gris-600);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;}
  .feed-item .meta .who{font-weight:700;color:var(--gris-800);}
  .feed-item .txt{font-size:14.5px;white-space:pre-wrap;}
  .foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .foto-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--gris-200);}
  .foto-item{position:relative;}
  .foto-item .del{
    position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;
    width:22px;height:22px;border-radius:6px;font-size:12px;
  }
  .nota-item{background:var(--gris-100);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative;}
  .nota-item .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--gris-400);font-size:12px;}
  .nota-item.resuelta{opacity:.6;}
  .nota-item.pendiente-incidencia{border-left:3px solid var(--naranja);}
  .firma-pad-wrap{border:1.5px solid var(--gris-200);border-radius:10px;background:#fff;overflow:hidden;}
  .firma-pad{width:100%;height:160px;display:block;cursor:crosshair;touch-action:none;}
  #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:260px;}
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#111827;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;
    max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;bottom:34px;}
  .conn-banner{display:none;padding:7px 16px;font-size:12.5px;font-weight:600;text-align:center;color:#fff;}
  .conn-banner.show{display:block;}
  .conn-banner.offline{background:var(--gris-600);}
  .conn-banner.syncing{background:var(--naranja);}
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;
    justify-content:center;z-index:200;
  }
  .modal-box{
    background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;
    max-height:85vh;overflow-y:auto;
  }
  @media (min-width:560px){
    .modal-bg{align-items:center;}
    .modal-box{border-radius:16px;}
  }
  .modal-box h3{font-size:17px;margin-bottom:14px;}
  .setup-banner{
    background:#fef3c7;border:1.5px solid #f59e0b;border-radius:12px;padding:16px;margin-bottom:14px;font-size:13.5px;line-height:1.5;
  }
  .setup-banner code{background:#fff;padding:2px 5px;border-radius:5px;font-size:12px;}
  .spin{
    width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;display:inline-block;animation:spin .7s linear infinite;
  }
  .spin-dark{border-color:rgba(0,0,0,.15);border-top-color:var(--primario);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .section-title{font-size:13px;font-weight:700;color:var(--gris-600);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px 2px;}
  .section-title:first-child{margin-top:0;}
  .muted{color:var(--gris-600);font-size:13px;}
  .link-btn{background:none;border:none;color:var(--primario);font-weight:600;font-size:13.5px;padding:6px 0;}
  .center{text-align:center;}
  hr.sep{border:none;border-top:1px solid var(--gris-200);margin:16px 0;}
  .brand{padding:8px 0 20px 0;}
  .brand-logo{
    width:56px;height:56px;border-radius:16px;margin:0 auto 12px auto;
    background:linear-gradient(135deg,var(--primario),var(--primario-osc));
    display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow:var(--sombra-lg);
  }
  .brand h2{font-size:20px;font-weight:800;color:var(--gris-800);}
  .brand p{margin-top:4px;}
  .login-card{max-width:420px;margin:24px auto 0 auto;}
  .badge-rol{
    display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
    vertical-align:middle;
  }
  .badge-rol.admin{background:var(--primario-claro);color:var(--primario-osc);}
  .badge-rol.instalador{background:#e0e7ff;color:#3730a3;}
  .badge-rol.inactivo{background:#fee2e2;color:var(--rojo);margin-left:6px;}
  .userrow{
    display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--gris-200);flex-wrap:wrap;
  }
  .userrow:last-child{border-bottom:none;}
  .userrow .info{flex:1;min-width:150px;}
  .userrow .info h3{font-size:14.5px;font-weight:700;}
  .stat-mini{display:flex;gap:10px;font-size:12.5px;color:var(--gris-600);flex-wrap:wrap;}
</style>
</head>
<body>

<div id="topbar">
  <button class="back" id="btnBack" style="display:none;">←</button>
  <div class="titulo">
    <h1 id="tbTitulo">Control de Instalación</h1>
    <div class="sub" id="tbSub"></div>
  </div>
  <button class="icon-btn" id="btnNotif" title="Notificaciones" style="display:none;">
    🔔<span id="bellDot"></span>
  </button>
  <button class="icon-btn" id="btnPerfil" title="Mi cuenta" style="display:none;">👤</button>
</div>

<div class="conn-banner" id="connBanner"></div>

<main id="app">
  <div class="center" style="padding:60px 0;">
    <div class="spin spin-dark" style="width:28px;height:28px;"></div>
    <p class="muted" style="margin-top:10px;">Cargando…</p>
  </div>
</main>

<div id="toast"></div>
<div id="modalRoot"></div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<!-- Generación de QR -->
<script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
<!-- Generación de PDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<!-- Lectura de QR con cámara -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<!-- Lectura/escritura de Excel/CSV -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
"use strict";

/* ============================================================
   CONFIGURACIÓN DE FIREBASE
   Sustituye estos valores por los de tu propio proyecto Firebase
   (gratuito). Instrucciones completas en README.md
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCfMF2O54skQbPWWrU9D8JqEV9XoPh3a2E",
  authDomain: "control-obra-70524.firebaseapp.com",
  projectId: "control-obra-70524",
  storageBucket: "control-obra-70524.firebasestorage.app",
  messagingSenderId: "97964883008",
  appId: "1:97964883008:web:53fb05438dcdab921133a5"
};

const CONFIG_OK = !Object.values(firebaseConfig).some(v => String(v).startsWith("TU_"));

/* ============================================================
   CONFIGURACIÓN DE CLOUDINARY (para fotos y planos)
   Alternativa gratuita sin tarjeta a Firebase Storage.
   Sustituye estos dos valores por los de tu propia cuenta Cloudinary
   (gratis, sin tarjeta). Instrucciones completas en README.md
   ============================================================ */
const CLOUDINARY_CONFIG = {
  cloudName: "vcjtar9m",
  uploadPreset: "control_obra"
};
const CLOUDINARY_OK = !CLOUDINARY_CONFIG.cloudName.startsWith("TU_") && !CLOUDINARY_CONFIG.uploadPreset.startsWith("TU_");

/* ============================================================
   CÓDIGO DE ACCESO PARA CREAR LA PRIMERA CUENTA DE ADMINISTRADOR
   Solo hace falta una vez, para dar de alta la primera cuenta de tu
   empresa (normalmente la tuya). Las siguientes cuentas (instaladores
   u otros administradores) se crean ya desde dentro de la app, en
   "Usuarios", sin necesidad de este código. Cámbialo por uno propio
   antes de desplegar la app. Instrucciones en README.md
   ============================================================ */
const ADMIN_PIN = "1926";

/* ============================================================
   NOMBRE DE LA APP (se muestra en la pantalla de inicio y el login)
   ============================================================ */
const NOMBRE_APP = "Control de Instalación";

/* ============================================================
   CONSTANTES DE DOMINIO
   ============================================================ */
const ETAPAS = ["instalada", "sellada", "acristalada", "composite", "terminada"];
const ETAPA_LABEL = { instalada: "Instalada", sellada: "Sellada", acristalada: "Acristalada", composite: "Composite", terminada: "Terminada" };
const ETAPA_ICONO = { instalada: "🪟", sellada: "🧴", acristalada: "🔷", composite: "🧱", terminada: "✅" };

function estadoVacio(){ return { instalada:false, sellada:false, acristalada:false, composite:false, terminada:false }; }

// Objeto {etapa: 0} para inicializar/leer el resumen de progreso guardado en el propio doc de la obra.
function progresoVacio(){ const p={}; ETAPAS.forEach(e=> p[e]=0); return p; }

// Devuelve la etapa más avanzada alcanzada (para colorear), o null si ninguna
function ultimaEtapa(estado){
  let last = null;
  for(const e of ETAPAS){ if(estado && estado[e]) last = e; }
  return last;
}
function pasosCompletados(estado){
  if(!estado) return 0;
  return ETAPAS.reduce((n,e)=> n + (estado[e] ? 1 : 0), 0);
}

// Estado de una casa completa para pintar su marca en el mapa de la promoción: la etapa "común" es
// la más avanzada que TODAS sus ventanas han alcanzado ya (el cuello de botella), aprovechando que
// las etapas se marcan en cascada (si una ventana está en "sellada" también está en "instalada").
function estadoCasaParaMapa(casa, ventanas){
  const de = ventanas.filter(v => (v.casa||"") === casa);
  if(!de.length) return { etapa: null, sinVentanas: true, incidenciaAbierta: false, pct: 0 };
  let etapaComun = null;
  for(const e of ETAPAS){ if(de.every(v => v.estado && v.estado[e])) etapaComun = e; else break; }
  const incidenciaAbierta = de.some(v => (v.incidencias||[]).some(i=>!i.resuelta));
  const checks = de.reduce((n,v)=> n + pasosCompletados(v.estado), 0);
  const pct = Math.round((checks/(de.length*ETAPAS.length))*100);
  return { etapa: etapaComun, sinVentanas: false, incidenciaAbierta, pct };
}

// Una ventana tiene datos "avanzados" (casa/planta/referencia) cuando viene de una importación Excel/CSV
function tieneDatosAvanzados(v){ return !!(v.casa || v.planta || v.referencia || v.numeroPlano); }

// Etiqueta corta para las tarjetas y el QR: el número del plano si existe, si no el V0001 interno
function etiquetaCorta(v){ return (v.numeroPlano && String(v.numeroPlano).trim()) || v.etiqueta; }

// Línea descriptiva para la pantalla de la ventana: "Casa 12 · Planta 2 · Ref. PVC-120x150"
function descripcionVentana(v){
  const partes = [];
  if(v.casa) partes.push(`Casa ${v.casa}`);
  if(v.planta) partes.push(`Planta ${v.planta}`);
  if(v.referencia) partes.push(`Ref. ${v.referencia}`);
  return partes.join(" · ");
}

// Comparador "natural" (Casa 2 antes que Casa 10) para ordenar casas/plantas/números de texto
function compararNatural(a, b){
  return String(a ?? "").localeCompare(String(b ?? ""), "es", { numeric: true, sensitivity: "base" });
}

// Da un rango numérico a la planta para que "Baja"/"Sótano" ordenen antes que "1", "2"...
function rangoPlanta(p){
  const n = normalizarCabecera(p);
  if(/sotano|garaje/.test(n)) return -2;
  if(/^(baja|bajo|pb)\b/.test(n) || n.includes("planta baja")) return -1;
  const num = parseFloat(n);
  return isNaN(num) ? 999 : num; // plantas con nombres raros van al final
}
function compararPlanta(a, b){
  return (rangoPlanta(a) - rangoPlanta(b)) || compararNatural(a, b);
}

function ordenarVentanas(lista){
  return [...lista].sort((a,b)=>
    compararNatural(a.casa, b.casa) ||
    compararPlanta(a.planta, b.planta) ||
    compararNatural(a.numeroPlano || a.etiqueta, b.numeroPlano || b.etiqueta)
  );
}

// Quita tildes y pasa a minúsculas, para reconocer cabeceras de columnas del Excel sin importar cómo las escriban
function normalizarCabecera(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
}

// Documentos de "parte de fabricación" (categoria:"fabricacion") cuyo campo `codigos` incluye el
// número de plano o el código interno de esta ventana en concreto — así, desde la ficha de la
// ventana, aparece directamente el documento que la menciona, sin tener que ir a buscarlo a mano.
function documentosParaVentana(v, docsFabricacion){
  const claves = [v.numeroPlano, v.etiqueta].map(normalizarCabecera).filter(Boolean);
  if(!claves.length || !docsFabricacion || !docsFabricacion.length) return [];
  return docsFabricacion.filter(p => (p.codigos||[]).some(c => claves.includes(normalizarCabecera(c))));
}

// Lista de plantas distintas presentes en una obra, ordenadas
function plantasDisponibles(ventanas){
  return [...new Set(ventanas.map(v=>v.planta).filter(Boolean))].sort(compararPlanta);
}
function filtrarPorPlanta(ventanas, planta){
  return planta ? ventanas.filter(v=>v.planta===planta) : ventanas;
}

const $app = () => document.getElementById("app");

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove("show"), 2600);
}

// Modo con menos datos: la app guarda los cambios en el propio móvil (vía Firestore offline,
// activado en init()) aunque no haya cobertura, y los sube solos en cuanto vuelve la señal — aquí
// solo se avisa de en qué situación está, para que nadie piense que se ha perdido lo que ha tocado.
function actualizarBannerConexion(){
  const banner = document.getElementById("connBanner");
  if(!banner) return;
  if(!navigator.onLine){
    banner.textContent = "📶 Sin conexión — los cambios se guardan en el móvil y se suben solos en cuanto vuelva la señal";
    banner.className = "conn-banner show offline";
  } else if(cambiosPendientes){
    banner.textContent = "🔄 Sincronizando cambios…";
    banner.className = "conn-banner show syncing";
  } else {
    banner.className = "conn-banner";
  }
}

// Llamar desde un onSnapshot con {includeMetadataChanges:true} pasándole doc.metadata: mientras el
// servidor no ha confirmado todavía la última escritura local, hasPendingWrites viene a true.
function marcarPendiente(metadata){
  cambiosPendientes = !!(metadata && metadata.hasPendingWrites);
  actualizarBannerConexion();
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fechaCorta(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"}) + " " +
         d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
}

function slug(s){
  return String(s||"obra").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "obra";
}

// Traduce los códigos de error más comunes de Firebase Auth a mensajes en español
function traducirErrorAuth(err){
  const map = {
    "auth/wrong-password":"Contraseña incorrecta.",
    "auth/user-not-found":"No existe ninguna cuenta con ese correo.",
    "auth/invalid-email":"Correo electrónico no válido.",
    "auth/too-many-requests":"Demasiados intentos. Espera un momento e inténtalo de nuevo.",
    "auth/email-already-in-use":"Ya existe una cuenta con ese correo.",
    "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
    "auth/invalid-credential":"Correo o contraseña incorrectos.",
    "auth/missing-password":"Escribe una contraseña.",
    "auth/user-disabled":"Esta cuenta ha sido deshabilitada."
  };
  return map[err.code] || ("Error: " + err.message);
}

/* ============================================================
   ENRUTADO (hash-based)
   #/                              -> lista de obras
   #/nueva                         -> nueva obra
   #/usuarios                      -> gestión de usuarios (admin)
   #/estadisticas                  -> estadísticas por instalador (admin)
   #/obra/{obraId}                 -> detalle de obra (tab ventanas)
   #/obra/{obraId}/fotos           -> detalle de obra (tab fotos y notas)
   #/obra/{obraId}/planos          -> detalle de obra (tab planos)
   #/obra/{obraId}/stats           -> detalle de obra (tab estadísticas)
   #/ventana/{obraId}/{ventanaId}  -> detalle de ventana
   #/scan                          -> escáner de QR
   ============================================================ */
function navegar(hash){ location.hash = hash; }

function route(){
  limpiarListeners();
  closeModal();

  if(!CONFIG_OK){ renderSetupNecesario(); return; }
  if(!currentUser){ actualizarTopbarIconos(); renderLogin(); return; }
  if(currentUserData === undefined){
    setTopbar(NOMBRE_APP, "", false);
    $app().innerHTML = `<div class="center" style="padding:60px 0;"><div class="spin spin-dark" style="width:28px;height:28px;"></div><p class="muted" style="margin-top:10px;">Cargando tu cuenta…</p></div>`;
    return;
  }
  if(currentUserData === null){ actualizarTopbarIconos(); renderCuentaNoConfigurada(); return; }
  if(currentUserData.activo === false){ actualizarTopbarIconos(); renderCuentaDesactivada(); return; }

  actualizarTopbarIconos();

  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);

  if(parts[0] === "nueva"){ if(!esAdmin()){ navegar("#/"); return; } setTopbar("Nueva obra","",true); renderNuevaObra(); }
  else if(parts[0] === "usuarios"){ if(!esAdmin()){ navegar("#/"); return; } setTopbar("Usuarios","Cuentas de tu equipo",true); renderUsuarios(); }
  else if(parts[0] === "estadisticas"){ if(!esAdmin()){ navegar("#/"); return; } setTopbar("Estadísticas","Actividad por instalador",true); renderEstadisticas(); }
  else if(parts[0] === "obra" && parts[1]){ renderObraDetalle(parts[1], parts[2], parts[3] ? decodeURIComponent(parts[3]) : null); }
  else if(parts[0] === "ventana" && parts[1] && parts[2]){ renderVentana(parts[1], parts[2]); }
  else if(parts[0] === "scan"){ setTopbar("Escanear QR","",true); renderScanner(); }
  else { setTopbar(NOMBRE_APP,"Control de instalación",false); renderListaObras(); }
}

function renderLogin(){

      <div class="brand center">
        <div class="brand-logo">🪟</div>
        <h2>${esc(NOMBRE_APP)}</h2>

      <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
      <button class="link-btn" id="btnOlvide" style="display:block;margin:10px auto 0;">¿Has olvidado tu contraseña?</button>
      <hr class="sep" />
      <button class="link-btn" id="btnPrimeraVez" style="display:block;margin:0 auto;">¿Primera vez? Crear cuenta de administrador</button>
    </div>
  `;
  const intentar = async ()=>{
    const email = document.getElementById("inpEmail").value.trim();
    const pass = document.getElementById("inpPass").value;
    if(!email || !pass){ toast("Escribe tu correo y contraseña"); return; }
    const btn = document.getElementById("btnLogin");
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Entrando…`;
    try{
      await auth.signInWithEmailAndPassword(email, pass);
    }catch(err){
      toast(traducirErrorAuth(err));
      btn.disabled = false; btn.textContent = "Entrar";
    }
  };
  document.getElementById("btnLogin").addEventListener("click", intentar);
  document.getElementById("inpPass").addEventListener("keydown", (e)=>{ if(e.key==="Enter") intentar(); });
  document.getElementById("btnOlvide").addEventListener("click", async ()=>{
    const email = document.getElementById("inpEmail").value.trim();
    if(!email){ toast("Escribe primero tu correo arriba"); return; }
    try{
      await auth.sendPasswordResetEmail(email);
      toast("Te hemos enviado un correo para restablecer la contraseña");
    }catch(err){ toast(traducirErrorAuth(err)); }
  });
  document.getElementById("btnPrimeraVez").addEventListener("click", pedirPinAdmin);
}

function pedirPinAdmin(){
  openModal(`
    <h3>Crear cuenta de administrador</h3>
    <p class="muted" style="margin-bottom:14px;">Usa esto solo la primera vez, para crear la primera cuenta de tu empresa.
    Las siguientes cuentas (instaladores u otros administradores) se crean después desde "Usuarios" dentro de la app.</p>
    <label class="field"><span>Código de la empresa</span><input type="password" inputmode="numeric" id="inpPin" placeholder="••••" /></label>
    <label class="field"><span>Tu nombre</span><input type="text" id="inpNombreNueva" /></label>
    <label class="field"><span>Correo electrónico</span><input type="text" id="inpEmailNueva" /></label>
    <label class="field"><span>Contraseña (mínimo 6 caracteres)</span><input type="password" id="inpPassNueva" /></label>
    <button class="btn btn-primary btn-block" id="btnCrearAdmin">Crear cuenta</button>
  `);
  document.getElementById("btnCrearAdmin").addEventListener("click", async ()=>{
    const pin = document.getElementById("inpPin").value.trim();
    const nombre = document.getElementById("inpNombreNueva").value.trim();
    const email = document.getElementById("inpEmailNueva").value.trim();
    const pass = document.getElementById("inpPassNueva").value;

    const btn = document.getElementById("btnCrearAdmin");
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Creando…`;
    try{

      await db.collection("usuarios").doc(cred.user.uid).set({

        creadoEn: firebase.firestore.FieldValue.serverTimestamp(),

      closeModal();

    }catch(err){
      toast(traducirErrorAuth(err));
      btn.disabled = false; btn.textContent = "Crear cuenta";
    }
  });

   ============================================================ */
function renderListaObras(){
  const admin = esAdmin();
  $app().innerHTML = `
    ${admin ? `
      <button class="btn btn-primary btn-block" id="btnNuevaObra">➕ Nueva obra</button>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-outline" id="btnUsuarios">👥 Usuarios</button>
        <button class="btn btn-outline" id="btnEstadisticas">📊 Estadísticas</button>
      </div>
      <button class="btn btn-outline btn-block" id="btnInformeGlobal" style="margin-top:10px;">📅 Informe de instalación</button>
    ` : ""}
    <button class="btn btn-outline btn-block" id="btnScanGlobal" style="margin-top:10px;">📷 Escanear QR de una ventana</button>
    <div class="section-title" style="margin-top:22px;">${admin ? "Tus obras" : "Obras"}</div>
    <div id="listaObras"><div class="empty">Cargando obras…</div></div>
  `;
  if(admin){
    document.getElementById("btnNuevaObra").addEventListener("click", ()=> navegar("#/nueva"));
    document.getElementById("btnUsuarios").addEventListener("click", ()=> navegar("#/usuarios"));
    document.getElementById("btnEstadisticas").addEventListener("click", ()=> navegar("#/estadisticas"));
    document.getElementById("btnInformeGlobal").addEventListener("click", ()=> abrirInformeInstalacion({ tipo: "global" }));
  }
  document.getElementById("btnScanGlobal").addEventListener("click", ()=> navegar("#/scan"));

  const unsub = db.collection("obras").orderBy("creadoEn","desc").onSnapshot(async (snap)=>{
    if(snap.empty){
      document.getElementById("listaObras").innerHTML = admin
        ? `<div class="empty">Aún no has creado ninguna obra.<br/>Pulsa "Nueva obra" para empezar.</div>`
        : `<div class="empty">Todavía no hay obras creadas por la oficina.</div>`;
      return;
    }
    const obras = snap.docs.map(d=>({id:d.id, ...d.data()}));

    if(!admin){
      // El instalador solo necesita ubicar la obra para llegar a sus ventanas, sin datos de gestión.
      document.getElementById("listaObras").innerHTML = obras.map(obra=>`
        <div class="obra-item" data-id="${obra.id}">
          <div class="avatar">${esc((obra.nombre||"?").slice(0,2).toUpperCase())}</div>
          <div class="info">
            <h3>${esc(obra.nombre||"Sin nombre")}</h3>
            <p>${esc(obra.direccion||"")}</p>
          </div>
        </div>
      `).join("");
      document.querySelectorAll(".obra-item").forEach(el=>{
        el.addEventListener("click", ()=> navegar(`#/obra/${el.dataset.id}`));
      });
      return;
    }

    // El progreso de cada obra se lee directamente del resumen guardado en su propio documento
    // (numVentanas/progreso) — NO se relee la subcolección de ventanas de cada obra. Esto es lo que
    // antes disparaba miles de lecturas cada vez que se volvía a esta pantalla; ahora cuesta 1
    // lectura por obra (la que ya hace falta para pintar la lista), sea cual sea su tamaño.
    // Una obra creada antes de este resumen (progreso === undefined) se autocompleta sola en cuanto
    // se entra en su detalle; hasta entonces aquí se ve con 0%, no hace falta releerla para saberlo.
    const filas = obras.map(obra=>{
      const total = obra.numVentanas || 0;
      const progreso = obra.progreso || {};
      const terminadas = progreso.terminada || 0;
      const checks = ETAPAS.reduce((n,e)=> n + (progreso[e]||0), 0);
      const pct = total ? Math.round((checks/(total*ETAPAS.length))*100) : 0;
      return {obra, total, terminadas, pct};
    });
    document.getElementById("listaObras").innerHTML = filas.map(({obra,total,terminadas,pct})=>`
      <div class="obra-item" data-id="${obra.id}">
        <div class="avatar">${esc((obra.nombre||"?").slice(0,2).toUpperCase())}</div>
        <div class="info">
          <h3>${esc(obra.nombre||"Sin nombre")}</h3>
          <p>${esc(obra.direccion||"")}${obra.direccion ? " · " : ""}${total} ventanas · ${terminadas} terminadas</p>
        </div>
        <div class="pct">${pct}%</div>
      </div>
    `).join("");
    document.querySelectorAll(".obra-item").forEach(el=>{
      el.addEventListener("click", ()=> navegar(`#/obra/${el.dataset.id}`));
    });
  }, (err)=>{ toast("Error cargando obras: " + err.message); });
  unsubscribers.push(unsub);
}

      <button class="btn btn-primary btn-block" id="btnCrear">Crear obra</button>
    </div>
  `;
  document.getElementById("btnCrear").addEventListener("click", async ()=>{

    const btn = document.getElementById("btnCrear");
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Creando…`;
    try{
      const obraRef = await db.collection("obras").add({
        nombre, direccion,
        numVentanas: cantidad,
        // Resumen de progreso guardado en la propia obra: se mantiene solo con pequeños incrementos
        // cada vez que se marca una etapa, para no tener que releer todas las ventanas cada vez que
        // se quiere ver el % completado (ver toggleEtapa y recalcularProgresoObra).
        progreso: progresoVacio(),
        creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
        creadoPor: nombreUsuario() || "Oficina"
      });
      if(cantidad > 0) await crearVentanas(obraRef.id, 1, cantidad);
      toast("Obra creada");
      navegar(`#/obra/${obraRef.id}`);
    }catch(err){
      toast("Error: " + err.message);
      btn.disabled = false; btn.textContent = "Crear obra";
    }
  });
}

function etiquetaVentana(n){ return "V" + String(n).padStart(4,"0"); }
// Etiqueta de los QR "genéricos" (sin casa/planta asignada todavía) — con prefijo G para distinguirlos a simple vista
function etiquetaGenerica(n){ return "G" + String(n).padStart(4,"0"); }

async function crearVentanas(obraId, desde, hasta){
  const obraRef = db.collection("obras").doc(obraId);
  let batch = db.batch();
  let count = 0;
  for(let n = desde; n <= hasta; n++){
    const ref = obraRef.collection("ventanas").doc(etiquetaVentana(n));
    batch.set(ref, {
      numero: n,
      etiqueta: etiquetaVentana(n),
      casa: "", planta: "", numeroPlano: "", referencia: "",
      asignada: true,
      estado: estadoVacio(),
      notas: [],
      fotos: [],
      incidencias: [],
      entrega: null,
      actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
    });
    count++;
    if(count % 400 === 0){ await batch.commit(); batch = db.batch(); }
  }
  await batch.commit();
}

// Crea QR "genéricos": sin casa/planta/número/referencia todavía. El instalador los asigna al escanear
// por primera vez en obra, para poder repartir libremente qué ventana física va en cada hueco.
// Crea N ventanas "placeholder" vacías, solo para poder generar un código QR físico por
// adelantado. Al escanear cada una por primera vez, se asigna (o se vincula a una ya existente,
// ver guardarAsignacion) — devuelve la lista de las creadas para poder imprimir sus QR al momento.
async function crearVentanasGenericas(obraId, cantidad, numeroInicial){
  const obraRef = db.collection("obras").doc(obraId);
  let batch = db.batch();
  let count = 0;
  const creadas = [];
  for(let i = 0; i < cantidad; i++){
    const n = numeroInicial + i;
    const etiqueta = etiquetaGenerica(n);
    const ref = obraRef.collection("ventanas").doc(etiqueta);
    batch.set(ref, {
      numero: n,
      etiqueta: etiqueta,
      casa: "", planta: "", numeroPlano: "", referencia: "",
      asignada: false,
      estado: estadoVacio(),
      notas: [],
      fotos: [],
      incidencias: [],
      entrega: null,
      actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
    });
    creadas.push({ id: etiqueta, etiqueta, numero: n, casa: "", planta: "", numeroPlano: "", referencia: "" });
    count++;
    if(count % 400 === 0){ await batch.commit(); batch = db.batch(); }
  }
  await batch.commit();
  return creadas;
}

// Crea ventanas a partir de filas ya normalizadas {casa, planta, numero, referencia}, importadas de un Excel/CSV.
// numeroInicial es el "numero" interno (para ordenar) a partir del cual seguir contando en esta obra.
async function crearVentanasDesdeFilas(obraId, filas, numeroInicial){
  const obraRef = db.collection("obras").doc(obraId);
  const idsUsados = new Set();
  let batch = db.batch();
  let count = 0;
  let n = numeroInicial;
  for(const fila of filas){
    const base = slug([fila.casa, fila.planta, fila.numero].filter(Boolean).join("-")) || `ventana-${n}`;
    let id = base, sufijo = 2;
    while(idsUsados.has(id)){ id = `${base}-${sufijo}`; sufijo++; }
    idsUsados.add(id);
    const ref = obraRef.collection("ventanas").doc(id);
    batch.set(ref, {
      numero: n,
      etiqueta: (fila.numero && String(fila.numero).trim()) || etiquetaVentana(n),
      casa: fila.casa || "",
      planta: fila.planta || "",
      numeroPlano: fila.numero || "",
      referencia: fila.referencia || "",
      asignada: true,
      estado: estadoVacio(),
      notas: [],
      fotos: [],
      incidencias: [],
      entrega: null,
      actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
    });
    n++;
    count++;
    if(count % 400 === 0){ await batch.commit(); batch = db.batch(); }
  }
  await batch.commit();
  return count;
}

// Lee un archivo .xlsx/.xls/.csv y devuelve filas normalizadas {casa, planta, numero, referencia}.
// Reconoce las columnas por su nombre de cabecera sin importar mayúsculas/tildes/orden.
async function leerFilasDesdeArchivo(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const MAPA_COLUMNAS = {
    casa: ["casa", "vivienda", "numero de casa", "nº casa", "n casa", "portal"],
    planta: ["planta", "piso"],
    numero: ["numero", "nº", "n", "numero de ventana", "nº ventana", "ventana", "num", "codigo"],
    referencia: ["referencia", "ref", "modelo", "tipo", "tipo ventana", "tipo de ventana"]
  };
  function buscarValor(filaObj, claves){
    for(const key of Object.keys(filaObj)){
      const norm = normalizarCabecera(key);
      if(claves.includes(norm)) return String(filaObj[key] ?? "").trim();
    }
    return "";
  }
  // Recorre TODAS las hojas del archivo (por ejemplo, una hoja por planta) y junta las ventanas de todas.
  const filas = [];
  for(const nombreHoja of wb.SheetNames){
    const hoja = wb.Sheets[nombreHoja];
    const filasCrudas = XLSX.utils.sheet_to_json(hoja, { defval: "" });
    filasCrudas.forEach(f=>{
      const fila = {
        casa: buscarValor(f, MAPA_COLUMNAS.casa),
        planta: buscarValor(f, MAPA_COLUMNAS.planta),
        numero: buscarValor(f, MAPA_COLUMNAS.numero),
        referencia: buscarValor(f, MAPA_COLUMNAS.referencia)
      };
      if(fila.casa || fila.planta || fila.numero || fila.referencia) filas.push(fila); // descarta filas totalmente vacías
    });
  }
  return filas;
}

function descargarPlantillaCsv(){
  const filas = [
    ["casa","planta","numero","referencia"],
    ["1","Baja","V01","PVC-120x150"],
    ["1","1","V02","PVC-90x120"],
    ["2","Baja","V01","RPT-Corredera-2H"]
  ];
  const csv = filas.map(f=> f.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["﻿"+csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "plantilla_ventanas.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

// Recalcula desde cero el resumen de progreso guardado en el doc de la obra (numVentanas y
// progreso por etapa), a partir de la lista de ventanas ya cargada. Sirve tanto para "sanar" obras
// antiguas que todavía no tienen ese resumen (se llama sola la primera vez que se abren) como para
// un botón manual de "recalcular" si alguna vez las cifras se desajustan por cualquier motivo.
async function recalcularProgresoObra(obraId, ventanas){
  const visibles = ventanas.filter(v => !v.aliasTo);
  const progreso = progresoVacio();
  visibles.forEach(v=> ETAPAS.forEach(e=>{ if(v.estado && v.estado[e]) progreso[e]++; }));
  try{
    await db.collection("obras").doc(obraId).update({ numVentanas: visibles.length, progreso });
  }catch(e){ /* no crítico: si falla, se sigue mostrando con las cifras que hubiera */ }
}

  function pintarVentanasGrid(obraId, ventanas){
    const cont = document.getElementById("tabContent");
    if(!ventanas.length){ cont.innerHTML = `<div class="empty">No hay ventanas todavía.</div>`; return; }

    const referencias = [...new Set(ventanas.map(v=>v.referencia).filter(Boolean))].sort(compararNatural);
    const textoNorm = normalizarCabecera(filtroTexto);
    const porReferencia = filtroReferencia ? ventanas.filter(v=>v.referencia===filtroReferencia) : ventanas;
    // Busca por código/número de plano, casa o etiqueta interna (V0001/G0002) a la vez: cubre tanto
    // "encontrar esta ventana en concreto" como "ver todas las de esta casa" con un único cuadro.
    const filtradas = textoNorm ? porReferencia.filter(v=>
      normalizarCabecera(v.numeroPlano).includes(textoNorm) ||
      normalizarCabecera(v.casa).includes(textoNorm) ||
      normalizarCabecera(v.etiqueta).includes(textoNorm)

    const agrupado = ventanas.some(v=>v.casa);

      const et = ultimaEtapa(v.estado);
      const sinAsignar = v.asignada === false;
      const nNotas = (v.notas||[]).length, nFotos = (v.fotos||[]).length;

          <div class="et">${sinAsignar ? "❓ Sin asignar" : (et ? ETAPA_LABEL[et] : "Pendiente")}</div>
        </div>`;
    }

    let cuerpoHtml;
    if(!filtradas.length){
      cuerpoHtml = `<div class="empty">${textoNorm ? "Ninguna ventana coincide con la búsqueda." : "Ninguna ventana con esa referencia."}</div>`;
    } else if(!agrupado){
      cuerpoHtml = `<div class="vgrid">${filtradas.map(chipHtml).join("")}</div>`;

        porCasa.get(casaKey).push(v);
      });
      cuerpoHtml = [...porCasa.entries()].map(([casaKey, lista])=>{
        const esSinCasa = casaKey === "__sin_casa__";
        const seleccion = esSinCasa && seleccionVarios;
        const checks = lista.reduce((n,v)=> n + pasosCompletados(v.estado), 0);
        const pctCasa = Math.round((checks/(lista.length*ETAPAS.length))*100);
        const porPlanta = new Map();
        lista.forEach(v=>{
          const plantaKey = v.planta || "__sin_planta__";
          if(!porPlanta.has(plantaKey)) porPlanta.set(plantaKey, []);
          porPlanta.get(plantaKey).push(v);
        });
        const plantasHtml = [...porPlanta.entries()].map(([plantaKey, vs])=>`
          <div class="section-title" style="margin-top:14px;">${plantaKey === "__sin_planta__" ? "Sin planta asignada" : "Planta " + esc(plantaKey)}</div>
          <div class="vgrid">${vs.map(v=>chipHtml(v, seleccion)).join("")}</div>
        `).join("");
        const barraSeleccion = esSinCasa ? `

    cont.querySelectorAll(".vchip").forEach(el=>{

  function pintarEstadisticasObra(){
    const cont = document.getElementById("tabContent");
    cont.innerHTML = `<div class="empty">Cargando estadísticas…</div>`;
    db.collection("eventos").where("obraId","==",obraId).get().then(snap=>{
      const eventos = snap.docs.map(d=>d.data());
      const filas = agregarPorInstalador(eventos);
      let filtro = "";

      function pintarFilas(){
        const norm = normalizarCabecera(filtro);
        const visibles = norm ? filas.filter(f=> normalizarCabecera(f.nombre).includes(norm)) : filas;
        if(!filas.length){ cont.innerHTML = `<div class="card"><div class="empty">Todavía no hay actividad registrada en esta obra.</div></div>`; return; }
        cont.innerHTML = `
          <div class="card">
            <label class="field"><span>Buscar instalador</span><input type="text" id="inpBuscarInstObra" value="${esc(filtro)}" placeholder="Nombre del instalador…" /></label>
            ${!visibles.length ? `<div class="empty">Ningún instalador coincide con la búsqueda.</div>` : visibles.map(f=>`
              <div class="userrow">
                <div class="info"><h3>${esc(f.nombre)}</h3><p class="muted">Última actividad: ${fechaCorta(f.ultima)}</p></div>
                <div class="stat-mini">
                  <span>🪟 ${f.instalada}</span><span>🧴 ${f.sellada}</span><span>🔷 ${f.acristalada}</span><span>🧱 ${f.composite}</span><span>✅ ${f.terminada}</span>
                </div>
              </div>
            `).join("")}
            <div class="btn-row" style="margin-top:14px;">
              <button class="btn btn-secondary" id="btnExpEstObraPdf">🧾 Exportar PDF</button>
              <button class="btn btn-secondary" id="btnExpEstObraXls">📊 Exportar Excel</button>
            </div>
          </div>
        `;
        const inp = document.getElementById("inpBuscarInstObra");
        if(inp){
          inp.addEventListener("input", ()=>{
            filtro = inp.value; pintarFilas();
            const inpN = document.getElementById("inpBuscarInstObra");
            if(inpN){ inpN.focus(); const p = inpN.value.length; inpN.setSelectionRange(p,p); }
          });
        }
        const bPdf = document.getElementById("btnExpEstObraPdf");
        if(bPdf) bPdf.addEventListener("click", ()=> generarPdfEstadisticas(obraData.nombre||"Obra", visibles));
        const bXls = document.getElementById("btnExpEstObraXls");
        if(bXls) bXls.addEventListener("click", ()=> generarExcelEstadisticas(`estadisticas_${slug(obraData.nombre)}`, visibles));
      }
      pintarFilas();
    }).catch(err=> cont.innerHTML = `<div class="empty">Error cargando estadísticas: ${esc(err.message)}</div>`);
  }

  const unsub = obraRef.onSnapshot({ includeMetadataChanges: true }, doc=>{
    if(!doc.exists){ toast("Esta obra ya no existe"); navegar("#/"); return; }
    obraData = doc.data();
    marcarPendiente(doc.metadata);
    pintar();
  }, err=> toast("Error: " + err.message));
  unsubscribers.push(unsub);

  const unsub2 = obraRef.collection("ventanas").orderBy("numero").onSnapshot(snap=>{
    ventanas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // Obra antigua sin el resumen de progreso todavía (creada antes de esta función): se calcula
    // una vez, sola, sin coste extra — ya estamos leyendo estas mismas ventanas para la cuadrícula.
    if(admin && obraData && obraData.progreso === undefined && !recalculando){
      recalculando = true;
      recalcularProgresoObra(obraId, ventanas).finally(()=> recalculando = false);
    }
    pintar();
  }, err=> toast("Error: " + err.message));
  unsubscribers.push(unsub2);

  const unsub3 = obraRef.collection("planos").orderBy("fecha","desc").onSnapshot(snap=>{
    planos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    pintar();
  }, err=> toast("Error cargando planos: " + err.message));
  unsubscribers.push(unsub3);
}

function abrirAddVentanas(obraId, totalActual){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  openModal(`
    <h3>Añadir más ventanas</h3>

    <button class="btn btn-primary btn-block" id="btnConfirmarMas">Añadir</button>
  `);
  document.getElementById("btnConfirmarMas").addEventListener("click", async ()=>{
    const n = parseInt(document.getElementById("inpMas").value,10);
    if(!n || n<1){ toast("Cantidad no válida"); return; }
    closeModal();
    try{
      await crearVentanas(obraId, totalActual+1, totalActual+n);
      await db.collection("obras").doc(obraId).update({ numVentanas: firebase.firestore.FieldValue.increment(n) });
      toast(`${n} ventanas añadidas`);
    }catch(err){ toast("Error: " + err.message); }
  });
}

    const estado = document.getElementById("importEstado");
    const btn = document.getElementById("btnImportar");
    filasListas = null;
    btn.disabled = true;
    if(!file) return;
    estado.textContent = "Leyendo archivo…";
    try{
      filasListas = await leerFilasDesdeArchivo(file);
      if(!filasListas.length){
        estado.textContent = "No se ha reconocido ninguna fila válida en ese archivo. Revisa que tenga cabeceras (casa, planta, numero, referencia) y al menos una fila de datos.";
        return;
      }
      estado.textContent = `Se han encontrado ${filasListas.length} ventanas. Pulsa Importar para añadirlas a esta obra.`;
      btn.disabled = false;
    }catch(err){
      estado.textContent = "No se ha podido leer el archivo: " + err.message;
    }
  });

  document.getElementById("btnImportar").addEventListener("click", async ()=>{
    if(!filasListas || !filasListas.length) return;
    const btn = document.getElementById("btnImportar");
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Importando…`;
    try{
      const n = await crearVentanasDesdeFilas(obraId, filasListas, numeroInicial);
      await db.collection("obras").doc(obraId).update({ numVentanas: firebase.firestore.FieldValue.increment(n) });
      toast(`${n} ventanas importadas`);
      closeModal();
    }catch(err){
      toast("Error importando: " + err.message);
      btn.disabled = false; btn.textContent = "Importar";
    }
  });
}

async function eliminarObra(obraId, obraData){
  if(!esAdmin()){ toast("Solo la oficina puede hacer esto"); return; }
  toast("Eliminando obra…");
  try{
    const obraRef = db.collection("obras").doc(obraId);
    const vSnap = await obraRef.collection("ventanas").get();
    let batch = db.batch(); let c=0;
    for(const doc of vSnap.docs){
      batch.delete(doc.ref); c++;
      if(c % 400 === 0){ await batch.commit(); batch = db.batch(); }
    }
    const pSnap = await obraRef.collection("planos").get();
    for(const doc of pSnap.docs){
      batch.delete(doc.ref); c++;
      if(c % 400 === 0){ await batch.commit(); batch = db.batch(); }
    }
    await batch.commit();
    // Limpia también el historial de eventos asociado a esta obra (mejor esfuerzo, no bloquea el borrado si falla)
    try{
      const eSnap = await db.collection("eventos").where("obraId","==",obraId).get();
      let batch2 = db.batch(); let c2=0;
      for(const doc of eSnap.docs){
        batch2.delete(doc.ref); c2++;
        if(c2 % 400 === 0){ await batch2.commit(); batch2 = db.batch(); }
      }
      await batch2.commit();
    }catch(e){ /* no crítico */ }
    await obraRef.delete();
    toast("Obra eliminada");
    navegar("#/");
  }catch(err){ toast("Error eliminando: " + err.message); }
}

async function eliminarVentana(obraId, ventanaId, v){
  const obraRef = db.collection("obras").doc(obraId);
  let aliasSnap;
  try{
    aliasSnap = await obraRef.collection("ventanas").where("aliasTo","==",ventanaId).get();
  }catch(e){ aliasSnap = { docs: [] }; }
  const nAlias = aliasSnap.docs.length;
  const aviso = nAlias
    ? `¿Eliminar la ventana ${etiquetaCorta(v)}? También se eliminarán ${nAlias} código${nAlias===1?"":"s"} QR que habían quedado vinculados a ella. Se perderá todo su avance, fotos, notas, incidencias y entrega firmada. Esta acción no se puede deshacer.`
    : `¿Eliminar la ventana ${etiquetaCorta(v)}? Se perderá todo su avance, fotos, notas, incidencias y entrega firmada. Esta acción no se puede deshacer.`;
  if(!confirmar(aviso)) return;
  toast("Eliminando ventana…");
  try{
    const batch = db.batch();
    batch.delete(obraRef.collection("ventanas").doc(ventanaId));
    aliasSnap.docs.forEach(d=> batch.delete(d.ref));
    await batch.commit();
    try{
      const snap = await obraRef.collection("ventanas").get();
      await recalcularProgresoObra(obraId, snap.docs.map(d=>({id:d.id, ...d.data()})));
    }catch(e){ /* no crítico */ }
    toast("Ventana eliminada");
    navegar(`#/obra/${obraId}`);
  }catch(err){ toast("Error eliminando: " + err.message); }
}

// Borrado en bloque para el grupo "Sin casa asignada" (códigos QR genéricos todavía sin usar,
// sobre todo). Devuelve true si se ha eliminado, false si el usuario ha cancelado o ha fallado.
async function eliminarVentanasSeleccionadas(obraId, ids){
  if(!ids.length){ return false; }
  const aviso = `¿Eliminar est${ids.length===1?"a":"as"} ${ids.length} ventana${ids.length===1?"":"s"} sin casa asignada? Esta acción no se puede deshacer.`;
  if(!confirmar(aviso)) return false;
  toast("Eliminando ventanas…");
  try{
    const obraRef = db.collection("obras").doc(obraId);
    const batch = db.batch();
    ids.forEach(id=> batch.delete(obraRef.collection("ventanas").doc(id)));
    await batch.commit();
    try{
      const snap = await obraRef.collection("ventanas").get();
      await recalcularProgresoObra(obraId, snap.docs.map(d=>({id:d.id, ...d.data()})));
    }catch(e){ /* no crítico */ }
    toast(`${ids.length} ventana${ids.length===1?"":"s"} eliminada${ids.length===1?"":"s"}`);
    return true;
  }catch(err){ toast("Error eliminando: " + err.message); return false; }
}

  const unsub = vRef.onSnapshot({ includeMetadataChanges: true }, doc=>{
    if(!doc.exists){ toast("Esta ventana ya no existe"); navegar(`#/obra/${obraId}`); return; }
    const data = doc.data();
    marcarPendiente(doc.metadata);
    // Este código QR quedó vinculado a otra ventana ya existente (ver guardarAsignacion):
    // redirige de forma transparente a los datos reales, sin duplicar nada.
    if(data.aliasTo && data.aliasTo !== ventanaId){ navegar(`#/ventana/${obraId}/${data.aliasTo}`); return; }
    pintar(data);
  }, err=> toast("Error: " + err.message));
  unsubscribers.push(unsub);

  const unsubDocs = obraRef.collection("planos").where("categoria","==","fabricacion").onSnapshot(snap=>{
    documentosFabricacion = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(ultimoV) pintar(ultimoV);
  }, err=>{ /* si falla, simplemente no se muestra el acceso directo; no bloquea el resto de la ficha */ });
  unsubscribers.push(unsubDocs);
}

// Busca ventanas ya existentes que puedan coincidir con los datos introducidos, para poder vincular
// un QR genérico a una de ellas en vez de duplicarla. Si solo se conoce el número de plano (sin la
// casa) puede haber varias coincidencias — el mismo número se suele repetir una vez por cada casa —
// así que se devuelven todas para que el usuario elija cuál es.
async function buscarVentanasCoincidentes(obraId, ventanaId, { casa, planta, numeroPlano }){
  if(!numeroPlano && !casa) return [];
  try{
    let q = db.collection("obras").doc(obraId).collection("ventanas");
    if(numeroPlano) q = q.where("numeroPlano","==",numeroPlano);
    if(casa) q = q.where("casa","==",casa);
    if(casa && planta) q = q.where("planta","==",planta);
    const snap = await q.get();
    return snap.docs.filter(d=> d.id !== ventanaId && !d.data().aliasTo);
  }catch(e){ return []; }
}

// Combina el avance real de "origenData" (etapas marcadas, fotos, notas, incidencias, entrega
// firmada) dentro de la ventana "destino", y deja el documento de origen como un simple alias
// (aliasTo) que apunta a ella. Sirve tanto para vincular un QR genérico recién creado (sin
// histórico todavía, así que fusionar no cambia nada) como para corregir la identificación de una
// ventana que ya tuviera trabajo hecho, sin perder ese trabajo por el camino.
async function fusionarVentanas(obraId, origenId, origenData, destino){
  const destinoRef = db.collection("obras").doc(obraId).collection("ventanas").doc(destino.id);
  const origenRef = db.collection("obras").doc(obraId).collection("ventanas").doc(origenId);

  const estadoCombinado = {};
  ETAPAS.forEach(e => estadoCombinado[e] = !!((destino.estado && destino.estado[e]) || (origenData.estado && origenData.estado[e])));
  const notas = [...(destino.notas||[]), ...(origenData.notas||[])];
  const fotos = [...(destino.fotos||[]), ...(origenData.fotos||[])];
  const incidencias = [...(destino.incidencias||[]), ...(origenData.incidencias||[])];
  const entrega = destino.entrega || origenData.entrega || null;

  await destinoRef.update({
    estado: estadoCombinado, notas, fotos, incidencias, entrega,
    actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
  });
  await origenRef.update({
    aliasTo: destino.id, asignada: true,
    actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
  });
  db.collection("obras").doc(obraId).update({ numVentanas: firebase.firestore.FieldValue.increment(-1) }).catch(()=>{});
  // El estado combinado puede haber cambiado los contadores agregados de la obra (progreso), así
  // que se recalculan desde cero para que el % y los contadores por etapa sigan siendo exactos.
  try{
    const snap = await db.collection("obras").doc(obraId).collection("ventanas").get();
    await recalcularProgresoObra(obraId, snap.docs.map(d=>({id:d.id, ...d.data()})));
  }catch(e){ /* no crítico */ }
}

// permitirVincular: true en la primera asignación de un QR genérico (pintarAsignacion), false al
// corregir después la identificación de una ventana ya asignada (abrirEditarAsignacion). En ambos
// casos, si los datos coinciden con una ventana que ya existe (normalmente importada del Excel, o
// una ventana real cuyo código se escribió mal la primera vez), se ofrece VINCULAR: el avance de
// ambas (etapas, fotos, notas, incidencias y entrega firmada) se combina en la ventana correcta, y
// esta queda como un simple alias que redirige a ella — no se pierde ningún trabajo ya hecho.
// Basta con conocer el número de plano (no hace falta la casa) para que la app busque la coincidencia.
async function guardarAsignacion(obraId, ventanaId, vRef, permitirVincular, origenData){
  const casa = document.getElementById("inpAsigCasa").value.trim();
  const planta = document.getElementById("inpAsigPlanta").value.trim();
  const numeroPlano = document.getElementById("inpAsigNumero").value.trim();
  const referencia = document.getElementById("inpAsigReferencia").value.trim();
  if(!casa && !numeroPlano){ toast("Indica al menos la casa o el número de plano"); return; }
  const datos = { casa, planta, numeroPlano, referencia };
  const origen = origenData || {};

  const btn = document.getElementById("btnGuardarAsignacion");
  const labelOriginal = btn ? btn.textContent : "Guardar";
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Buscando…`; }

  const candidatos = await buscarVentanasCoincidentes(obraId, ventanaId, { casa, planta, numeroPlano });

  if(!candidatos.length){
    if(btn){ btn.innerHTML = `<span class="spin"></span> Guardando…`; }
    await guardarVentanaNueva(obraId, ventanaId, vRef, datos);
    if(btn){ btn.disabled = false; btn.textContent = labelOriginal; }
    return;
  }

  if(btn){ btn.disabled = false; btn.textContent = labelOriginal; }

  if(candidatos.length === 1){
    const c = candidatos[0].data();
    const detalle = `Casa ${c.casa||"—"}${c.planta?", Planta "+c.planta:""}, Nº ${c.numeroPlano||numeroPlano}${c.referencia?" ("+c.referencia+")":""}`;
    const vincular = confirmar(
      permitirVincular
        ? `Ya existe la ventana ${detalle} (probablemente importada del Excel).\n\n` +
          `Aceptar = vincular este código QR a esa ventana ya existente (recomendado, evita duplicados).\n` +
          `Cancelar = crear esta como una ventana nueva independiente.`
        : `Ya hay otra ventana con estos datos: ${detalle}.\n\n` +
          `Aceptar = vincular esta ventana con esa (se combina el avance de ambas: etapas marcadas, ` +
          `fotos, notas, incidencias y entrega firmada — recomendado si el código se escribió mal).\n` +
          `Cancelar = guardar igualmente esta ventana como una independiente (por si de verdad son dos ventanas distintas).`
    );
    if(vincular){
      if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Vinculando…`; }
      await vincularVentana(obraId, ventanaId, vRef, candidatos[0], origen);
      if(btn){ btn.disabled = false; btn.textContent = labelOriginal; }
      return;
    }
    await guardarVentanaNueva(obraId, ventanaId, vRef, datos);
    return;
  }

  // Varias ventanas comparten ese número (normal si no se indicó la casa): que el usuario elija cuál es.
  abrirSelectorVinculo(obraId, ventanaId, vRef, candidatos, datos, origen);
}

async function toggleEtapa(obraId, obraNombre, vRef, ventanaId, ventanaEtiqueta, estadoActual, etapa){
  const idx = ETAPAS.indexOf(etapa);
  const activar = !estadoActual[etapa];
  const nuevo = { ...estadoActual };
  if(activar){
    // marcar esta y todas las anteriores
    for(let i=0;i<=idx;i++) nuevo[ETAPAS[i]] = true;
  } else {
    // desmarcar esta y todas las posteriores
    for(let i=idx;i<ETAPAS.length;i++) nuevo[ETAPAS[i]] = false;
  }
  // Un solo clic (p.ej. "Terminada") puede marcar en cascada varias etapas a la vez: registramos
  // un evento por cada etapa que realmente cambia, para que las estadísticas por instalador cuenten bien.
  const cambiadas = ETAPAS.filter(e => nuevo[e] !== estadoActual[e]);
  try{
    await vRef.update({ estado: nuevo, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp() });
    cambiadas.forEach(e => registrarEvento(obraId, obraNombre, ventanaId, ventanaEtiqueta, e, nuevo[e]));
    // El resumen de progreso vive en el propio doc de la obra (progreso.<etapa>), para poder ver el
    // % y los contadores sin tener que releer todas las ventanas cada vez. Aquí solo lo ajustamos en
    // +1/-1 por cada etapa que ha cambiado de verdad — el listener de la obra recoge el cambio al vuelo.
    if(cambiadas.length){
      const incrementos = {};
      cambiadas.forEach(e => { incrementos[`progreso.${e}`] = firebase.firestore.FieldValue.increment(nuevo[e] ? 1 : -1); });
      db.collection("obras").doc(obraId).update(incrementos).catch(()=>{});
    }
    // Cada vez que se marca (no desmarca) algo, ofrecemos foto + nota al momento.
    // Es un aviso fuerte pero saltable: no bloquea si el instalador no tiene foto o conexión.
    const activadas = cambiadas.filter(e => nuevo[e] === true);
    if(activadas.length) abrirCapturaRapida(obraId, ventanaId, vRef, activadas);
  }catch(err){ toast("Error guardando: " + err.message); }
}

// Modal rápido de foto + nota que aparece justo después de marcar una o varias etapas.
// Pensado para animar (no obligar) a documentar cada avance con foto en el momento: es saltable

    <input type="file" id="inpFotoRapida" accept="image/*" capture="environment" style="display:none;" />
    <button class="btn btn-block" id="btnFotoRapida" type="button">📷 Añadir foto</button>
    <div id="fotoRapidaEstado" class="muted" style="margin:6px 0;"></div>

      <textarea id="inpNotaRapida" rows="3" placeholder="Ej: falta un tornillo, pendiente de silicona…"></textarea>
    </label>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn" id="btnSaltarCaptura" type="button">Continuar sin foto</button>
      <button class="btn btn-primary" id="btnGuardarCaptura" type="button">Guardar y cerrar</button>
    </div>
  `);

  let fotoLista = null;
  document.getElementById("btnFotoRapida").addEventListener("click", ()=> document.getElementById("inpFotoRapida").click());
  document.getElementById("inpFotoRapida").addEventListener("change", (e)=>{
    fotoLista = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    document.getElementById("fotoRapidaEstado").textContent = fotoLista ? `Lista: ${fotoLista.name}` : "";
  });

  async function guardarYCerrar(){
    const notaTxt = (document.getElementById("inpNotaRapida").value || "").trim();
    const btnG = document.getElementById("btnGuardarCaptura");
    const btnS = document.getElementById("btnSaltarCaptura");
    if(btnG){ btnG.disabled = true; btnG.innerHTML = `<span class="spin"></span> Guardando…`; }
    if(btnS){ btnS.disabled = true; }
    const autor = nombreUsuario() || "—";
    try{
      if(fotoLista && CLOUDINARY_OK){
        const { url, publicId } = await subirArchivoCloudinary(fotoLista);
        await vRef.update({
          fotos: firebase.firestore.FieldValue.arrayUnion({ url, publicId, autor, fecha: new Date().toISOString() }),
          actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else if(fotoLista && !CLOUDINARY_OK){
        toast("Falta configurar Cloudinary: la foto no se pudo subir (ver README.md)");
      }
      if(notaTxt){
        await vRef.update({
          notas: firebase.firestore.FieldValue.arrayUnion({ texto: notaTxt, autor, fecha: new Date().toISOString() }),
          actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }catch(err){ toast("Aviso: no se pudo guardar la foto/nota (" + err.message + ")"); }
    closeModal();
  }

  document.getElementById("btnGuardarCaptura").addEventListener("click", guardarYCerrar);
  // "Continuar sin foto" también guarda la nota si el instalador escribió algo, pero nunca bloquea.
  document.getElementById("btnSaltarCaptura").addEventListener("click", guardarYCerrar);
}

// Sube un archivo a Cloudinary (imagen o PDF) usando el preset sin firmar. Sirve tanto para fotos como para planos.
async function subirArchivoCloudinary(file){
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY_CONFIG.uploadPreset);
  const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/auto/upload`, {
    method: "POST", body: fd
  });
  const data = await resp.json();
  if(!resp.ok || !data.secure_url){
    throw new Error(data?.error?.message || "Fallo al subir el archivo");
  }
  return { url: data.secure_url, publicId: data.public_id, resourceType: data.resource_type };
}

// Panel de firma a mano (justificante de entrega al cliente). Usa Pointer Events para que
// funcione igual con el dedo (táctil) que con ratón, sin depender de ninguna librería externa.
function inicializarFirmaPad(canvas){
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1f2937";

  let dibujando = false, huboTrazo = false, ultimoX = 0, ultimoY = 0;
  function posicion(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function empezarTrazo(e){
    dibujando = true;
    const p = posicion(e);
    ultimoX = p.x; ultimoY = p.y;
    if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
  }
  function seguirTrazo(e){
    if(!dibujando) return;
    const p = posicion(e);
    ctx.beginPath(); ctx.moveTo(ultimoX, ultimoY); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimoX = p.x; ultimoY = p.y; huboTrazo = true;
  }
  function terminarTrazo(){ dibujando = false; }

  canvas.addEventListener("pointerdown", empezarTrazo);
  canvas.addEventListener("pointermove", seguirTrazo);
  canvas.addEventListener("pointerup", terminarTrazo);
  canvas.addEventListener("pointerleave", terminarTrazo);
  canvas.addEventListener("pointercancel", terminarTrazo);

  return {
    estaVacia: ()=> !huboTrazo,
    limpiar: ()=>{ ctx.clearRect(0, 0, canvas.width, canvas.height); huboTrazo = false; },
    obtenerBlob: ()=> new Promise(resolve => canvas.toBlob(resolve, "image/png"))
  };
}

// Los "códigos" se escriben libremente (separados por coma, espacio, punto y coma o salto de
// línea) y se guardan tal cual para mostrarlos, pero la búsqueda/coincidencia con cada ventana se
// hace siempre normalizando (mayúsculas/tildes/espacios) con normalizarCabecera, igual que el
// buscador de ventanas — así "1143", "1143 " o "Nº1143" encuentran la misma ventana.
function parseCodigosVentana(texto){
  return (texto||"")
    .split(/[,;\n]+|\s{1,}/)
    .map(s=> s.trim())
    .filter(Boolean);
}

async function subirPlano(obraId, files, categoria, ambito, codigosVentana){
  if(!files || !files.length) return;
  if(!CLOUDINARY_OK){
    toast("Falta configurar Cloudinary para poder subir documentos (ver README.md)");
    document.getElementById("inpPlano").value = "";
    return;
  }
  const subidoPor = nombreUsuario() || "—";
  const esFabricacion = categoria === "fabricacion";
  codigosVentana = codigosVentana || [];
  toast(`Subiendo ${files.length} documento(s)…`);
  const obraRef = db.collection("obras").doc(obraId);
  for(const file of files){
    try{
      const { url, publicId } = await subirArchivoCloudinary(file);
      // OJO: Cloudinary clasifica los PDF también como resource_type "image" (para poder generar
      // miniaturas de sus páginas), así que NO sirve para distinguir un PDF de una foto real — hay
      // que mirar el propio archivo (nombre/tipo) o el resultado se intenta mostrar como <img> y
      // sale roto. Miramos la extensión y el MIME type del archivo original.
      const esPdf = /\.pdf$/i.test(file.name||"") || file.type === "application/pdf";
      await obraRef.collection("planos").add({
        nombre: file.name || (esFabricacion ? "Parte de fabricación" : "Plano"),
        url, publicId,
        tipo: esPdf ? "pdf" : "image",
        categoria: esFabricacion ? "fabricacion" : "plano",
        ambito: esFabricacion ? (ambito || "") : "",
        codigos: esFabricacion ? codigosVentana : [],
        subidoPor,
        fecha: new Date().toISOString()
      });
    }catch(err){ toast("Error subiendo documento: " + err.message); }
  }
  toast("Documento(s) subido(s)");
  document.getElementById("inpPlano").value = "";
}

/* ============================================================
   MAPA DE LA PROMOCIÓN: imagen del plano + marcas de cada casa
   ============================================================ */
async function subirMapaObra(obraId, file){
  if(!CLOUDINARY_OK){ toast("Falta configurar Cloudinary para poder subir el plano (ver README.md)"); return; }
  toast("Subiendo plano…");
  try{
    const { url, publicId } = await subirArchivoCloudinary(file);
    const esPdf = /\.pdf$/i.test(file.name||"") || file.type === "application/pdf";
    // El plano se pinta en un <img>, y un PDF no se puede mostrar ahí directamente: se le pide a
    // Cloudinary que convierta su primera página a JPG (pg_1), reutilizando el mismo archivo que
    // ya se ha subido — así no hace falta guardar dos URLs distintas para la misma obra.
    const mapaUrl = esPdf
      ? `https://res.cloudinary.com/${CLOUDINARY_CONFIG.cloudName}/image/upload/pg_1/${publicId}.jpg`
      : url;
    await db.collection("obras").doc(obraId).update({ mapaUrl });
    toast("Plano subido");
  }catch(err){ toast("Error subiendo el plano: " + err.message); }
}

// Crea la cuenta en una instancia SECUNDARIA de Firebase Auth, para no cerrar la sesión
// del administrador que la está creando (truco habitual sin backend propio).
async function crearUsuario(nombre, email, password, rol){
  let secApp;
  try{ secApp = firebase.app("secundaria"); }
